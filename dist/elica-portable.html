:root{--bg:#EDEEE9;--card:#fff;--ink:#121310;--mute:#6B6E66;--line:#DCDED6;--acc:#CBF74A;--accd:#7BA80F;--bad:#FF5A36;--badbg:#FFE4DC;--code:#17180F;--side:240px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:'Geist',system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.app{max-width:560px;margin:0 auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 100px)}

/* barra in alto */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{font-weight:700;font-size:19px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px}
.stats{display:flex;gap:14px;font-family:'Geist Mono',monospace;font-size:14px;font-weight:500}
.stat{display:flex;align-items:center;gap:5px}
.stat svg{width:16px;height:16px}
.stat.off{color:var(--mute)}
.stat .h{color:var(--bad);display:flex}

/* chip */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 18px;padding:0 18px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 15px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px}
.chip svg{width:13px;height:13px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.lk{color:var(--mute)}
.chip.on.lk{color:#fff}

/* card */
.card{background:var(--card);border-radius:18px;padding:18px;margin-bottom:14px}
.goal-row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--mute);gap:10px}
.goal-row b{color:var(--ink);font-family:'Geist Mono',monospace;font-weight:500}
.bar{height:6px;background:var(--bg);border-radius:9px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:9px;transition:width .5s}

/* sessione del giorno */
.sess{background:var(--ink);color:#fff;border-radius:22px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.sess .k{font-family:'Geist Mono',monospace;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--acc)}
.sess h2{font-size:24px;letter-spacing:-.03em;line-height:1.15;margin:6px 0 12px}
.sess ul{list-style:none;display:flex;flex-direction:column;gap:6px;margin-bottom:16px;font-size:14.5px;color:#D7DACD}
.sess li{display:flex;gap:10px;align-items:center}
.sess li i{width:22px;height:22px;border-radius:50%;background:#26281E;color:var(--acc);display:grid;place-items:center;font-style:normal;font-family:'Geist Mono',monospace;font-size:11px;flex:none}
.sess .btn{background:var(--acc);color:var(--ink)}
.sess.done{background:var(--card);color:var(--ink)}
.sess.done ul{color:var(--mute)}
.sess.done li i{background:var(--bg);color:var(--ink)}
.sess.done .btn{background:var(--ink);color:#fff}
.sess .helix{position:absolute;right:-18px;top:-10px;width:120px;height:120px;opacity:.09;color:var(--acc)}

/* corso e lezioni */
.chead h1{font-size:32px;line-height:1.05;letter-spacing:-.035em;font-weight:700}
.chead p{color:var(--mute);margin:8px 0 24px;font-size:15px}
.lockp{background:var(--card);border-radius:18px;padding:18px;margin-bottom:24px}
.lockp b{display:flex;align-items:center;gap:8px}
.lockp b svg{width:18px;height:18px}
.lockp p{color:var(--mute);font-size:14.5px;margin:6px 0 12px}
.unit{margin-bottom:24px}
.unit-t{font-family:'Geist Mono',monospace;font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);margin-bottom:6px}
.path{position:relative}
.path::before{content:'';position:absolute;left:21px;top:34px;bottom:34px;width:1.5px;background:var(--line)}
.lrow{display:flex;align-items:center;gap:6px}
.les{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:11px 0;flex:1;min-width:0}
.thb{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--mute);flex:none}
.thb:hover{background:var(--card);color:var(--ink)}
.thb svg{width:18px;height:18px}
.les .dot{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:'Geist Mono',monospace;font-size:13px;font-weight:500;border:1.5px solid var(--line);background:var(--bg);position:relative;z-index:1}
.les .dot svg{width:18px;height:18px}
.les.done .dot{background:var(--ink);color:var(--acc);border-color:var(--ink)}
.les.cur .dot{background:var(--acc);border-color:var(--ink)}
.les.lock{opacity:.4;cursor:default}
.les .t{font-weight:600;font-size:16px;letter-spacing:-.01em}
.les .s{font-size:13px;color:var(--mute)}
.les .go{margin-left:auto;font-size:13px;font-weight:600;background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;flex:none}

/* navigazione */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(237,238,233,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 0 calc(env(safe-area-inset-bottom) + 6px);z-index:5}
.nav-in{max-width:560px;margin:0 auto;display:flex}
.nav .nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--mute);padding:6px;position:relative}
.nav .nb.on{color:var(--ink)}
.nav svg{width:22px;height:22px}
.nav .cnt{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-family:'Geist Mono',monospace;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.nav .side-brand{display:none}

/* lezione */
.lesson{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column}
.l-top{max-width:680px;width:100%;margin:0 auto;display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 14px) 18px 8px}
.l-x{width:32px;height:32px;display:grid;place-items:center;flex:none}
.l-x svg{width:20px;height:20px}
.prog{flex:1;height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);border-radius:9px;transition:width .35s}
.l-body{flex:1;overflow-y:auto;max-width:680px;width:100%;margin:0 auto;padding:20px 18px 230px}
.kind{font-family:'Geist Mono',monospace;font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{background:var(--ink);color:var(--acc);border-radius:6px;padding:2px 7px;letter-spacing:.04em}
.tag.err{background:var(--bad);color:#fff}
.q{font-size:23px;font-weight:600;letter-spacing:-.025em;line-height:1.22;margin-bottom:18px}
.txt{font-size:17px;margin-bottom:16px}
.txt p+p{margin-top:10px}
.txt strong,.pts strong,.box strong{font-weight:650}
.txt code,.pts code,.box code{font-family:'Geist Mono',monospace;font-size:.88em;background:rgba(18,19,16,.07);padding:1px 5px;border-radius:5px}
.pts{margin:0 0 18px;padding-left:20px;font-size:16px;display:flex;flex-direction:column;gap:6px}
.box{border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:15px;line-height:1.45}
.box>b{display:block;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.box.warn{background:#FFF1D6}
.box.warn>b{color:#9A6100}
.box.cpp{background:#E4ECF7}
.box.cpp>b{color:#33568C}
.thcard{background:var(--card);border-radius:16px;padding:16px;margin:14px 0}
.thcard h3{font-size:18px;letter-spacing:-.02em;margin-bottom:8px}
.thcard .txt{font-size:16px}
.fblink{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:14px;font-weight:600;text-decoration:underline}
.fblink svg{width:16px;height:16px}
pre.code{background:var(--code);color:#E9EBE2;border-radius:14px;padding:16px;font-family:'Geist Mono',monospace;font-size:13.5px;line-height:1.65;overflow-x:auto;margin-bottom:20px;white-space:pre;tab-size:4}
.k{color:var(--acc)}.s1{color:#F2C46B}.n{color:#93D5FF}.c{color:#80847A;font-style:italic}
.blank{display:inline-block;min-width:46px;border-bottom:2px solid var(--acc);text-align:center;padding:0 5px;color:#fff;cursor:pointer}
.blank.f{background:rgba(203,247,74,.16);border-radius:4px 4px 0 0}
.blank.next{animation:pulse 1.4s infinite}
@keyframes pulse{50%{border-color:rgba(203,247,74,.3)}}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--card);border:1.5px solid transparent;border-radius:14px;padding:15px 16px;text-align:left;font-size:16px;font-weight:500;transition:border-color .15s;display:flex;gap:12px;align-items:baseline}
.opt.mono{font-family:'Geist Mono',monospace;font-size:14.5px;font-weight:400}
.opt.sel{border-color:var(--ink)}
.opt.right{border-color:var(--accd);background:#F4FCE0}
.kb{display:none;font-family:'Geist Mono',monospace;font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:0 5px;flex:none}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tok{background:var(--card);border-radius:10px;padding:10px 15px;font-family:'Geist Mono',monospace;font-size:15px;border:1.5px solid var(--line)}
.tok.used{opacity:.2;pointer-events:none}
.ans-area{min-height:110px;border:1.5px dashed #C7CAC0;border-radius:14px;padding:8px;margin-bottom:16px;display:flex;flex-direction:column;gap:6px}
.ans-area .ph{color:var(--mute);font-size:14px;margin:auto;text-align:center}
.pool{display:flex;flex-direction:column;gap:8px}
.ln{background:var(--card);border-radius:10px;padding:10px 12px;font-family:'Geist Mono',monospace;font-size:13px;text-align:left;white-space:pre;border:1.5px solid var(--line);overflow-x:auto}
.ans-area .ln{background:var(--code);color:#E9EBE2;border-color:var(--code)}
.ln.used{display:none}
.buglines{background:var(--code);border-radius:14px;padding:8px 0;overflow-x:auto}
.bl{display:flex;gap:12px;width:100%;text-align:left;padding:5px 14px;font-family:'Geist Mono',monospace;font-size:13.5px;line-height:1.55;color:#E9EBE2;white-space:pre;border-left:3px solid transparent}
.bl .no{color:#5E6256;min-width:14px;text-align:right;flex:none}
.bl.sel{background:rgba(203,247,74,.13);border-left-color:var(--acc)}
.bl.right{background:rgba(203,247,74,.22);border-left-color:var(--acc)}
.bl.wrong{background:rgba(255,90,54,.2);border-left-color:var(--bad)}
.inp{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;font-family:'Geist Mono',monospace;font-size:16px;color:var(--ink);outline:0}
.inp:focus{border-color:var(--ink)}
.hint{font-size:13px;color:var(--mute);margin-top:8px}
.l-foot{position:fixed;left:0;right:0;bottom:0;padding:16px 18px calc(env(safe-area-inset-bottom) + 16px);background:linear-gradient(transparent,var(--bg) 30%);transition:background .2s}
.l-foot-in{max-width:680px;margin:0 auto}
.btn{width:100%;padding:16px;border-radius:14px;background:var(--ink);color:#fff;font-weight:600;font-size:16px;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn:disabled{background:var(--line);color:var(--mute)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.acc{background:var(--acc);color:var(--ink)}
.btn.sm{padding:11px 14px;font-size:14px;width:auto}
.btn+.btn{margin-top:10px}
.fb{display:none;margin-bottom:14px}
.fb h3{font-size:18px;letter-spacing:-.01em;margin-bottom:4px}
.fb p{font-size:14.5px;line-height:1.45}
.fb code{font-family:'Geist Mono',monospace;font-size:13.5px;background:rgba(0,0,0,.07);padding:1px 5px;border-radius:5px}
.l-foot.ok{background:var(--acc)}
.l-foot.ko{background:var(--badbg)}
.l-foot.ko .btn{background:var(--bad)}
.l-foot.ok .fb,.l-foot.ko .fb{display:block}
.center{display:flex;flex-direction:column;justify-content:center;min-height:65dvh}
.big{font-size:64px;font-weight:700;letter-spacing:-.05em;line-height:1}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:28px 0}
.sumgrid.four{grid-template-columns:repeat(2,1fr)}
.sum{background:var(--card);border-radius:14px;padding:14px}
.sum b{display:block;font-family:'Geist Mono',monospace;font-size:20px;font-weight:500}
.sum span{font-size:12px;color:var(--mute)}
.newbadge{background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;margin-bottom:10px}
.newbadge .bi{background:var(--acc);color:var(--ink);margin:0}
.plan{display:flex;flex-direction:column;gap:10px;margin:22px 0}
.plan div{background:var(--card);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.plan .bi{margin:0;width:36px;height:36px;font-size:12px}
.plan small{display:block;color:var(--mute);font-size:13px}

/* pagine */
.h1{font-size:32px;font-weight:700;letter-spacing:-.035em;line-height:1.05;margin-bottom:6px}
.sub{color:var(--mute);font-size:15px;margin-bottom:22px}
.lvl{display:flex;align-items:flex-end;justify-content:space-between}
.lvl .big{font-size:56px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:var(--card);border-radius:16px;padding:14px 10px;text-align:center;font-size:12.5px;line-height:1.25}
.badge.off{opacity:.38}
.bi{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--acc);display:grid;place-items:center;margin:0 auto 8px;font-family:'Geist Mono',monospace;font-size:13px;font-weight:500;flex:none}
.bi svg{width:20px;height:20px}
.badge.off .bi{background:var(--line);color:var(--mute)}
.prow{margin-bottom:14px}
.prow:last-child{margin-bottom:0}
.prow .goal-row{color:var(--ink);font-size:15px;font-weight:500}
.prow .goal-row b{color:var(--mute);font-size:13px}
.sect{font-family:'Geist Mono',monospace;font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute);margin:26px 0 10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:9px 14px;border-radius:10px;border:1px solid var(--line);font-size:14px;font-weight:500}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.set-row{padding:4px 0 14px}
.set-row+.set-row{border-top:1px solid var(--bg);padding-top:14px}
.set-row .lbl{font-weight:600;font-size:15px;margin-bottom:8px}
.set-row .lbl small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1;min-width:140px}
.row .btn+.btn{margin-top:0}
textarea.paste{width:100%;min-height:80px;border:1.5px solid var(--line);border-radius:12px;padding:10px;font-family:'Geist Mono',monospace;font-size:12px;background:var(--bg);resize:vertical;margin:10px 0}
.err-i{background:var(--card);border-radius:14px;padding:13px 15px;margin-bottom:8px}
.err-i .m{font-size:12px;color:var(--mute);display:flex;justify-content:space-between;gap:8px}
.err-i .x{font-size:15px;font-weight:500;margin-top:2px}
.err-i .cd{font-family:'Geist Mono',monospace;font-size:12.5px;color:var(--mute);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;padding:40px 10px;color:var(--mute)}
.empty .bi{margin-bottom:14px}
.note{font-size:13px;color:var(--mute);margin-top:10px}
.linkb{font-size:14px;color:var(--mute);text-decoration:underline;margin-top:18px;display:inline-block}
.linkb.arm{color:var(--bad);font-weight:600}
.foot-ver{font-family:'Geist Mono',monospace;font-size:12px;color:var(--mute);margin-top:26px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}

/* lab */
.editor{background:var(--code);border-radius:16px;overflow:hidden;margin-bottom:12px}
.editor textarea{display:block;width:100%;min-height:260px;background:transparent;color:#E9EBE2;border:0;outline:0;resize:vertical;padding:16px;font-family:'Geist Mono',monospace;font-size:13.5px;line-height:1.6;tab-size:4;white-space:pre;overflow-x:auto}
.keys{display:flex;gap:6px;overflow-x:auto;padding:8px;border-top:1px solid #2A2C22;scrollbar-width:none}
.keys::-webkit-scrollbar{display:none}
.keys button{flex:none;min-width:38px;padding:7px 10px;border-radius:8px;background:#26281E;color:#E9EBE2;font-family:'Geist Mono',monospace;font-size:14px}
.out{background:var(--card);border-radius:16px;padding:16px;font-family:'Geist Mono',monospace;font-size:13px;white-space:pre-wrap;word-break:break-word;min-height:70px;margin-top:12px}
.out.err{color:#C23A1C}
.out .ph{color:var(--mute)}

/* sfide di codice */
.les.ch .dot{border-style:dashed}
.les.ch.cur .dot{background:var(--ink);color:var(--acc);border:1.5px solid var(--ink)}
.les.ch.cur .dot svg,.les.ch .dot svg{width:20px;height:20px}
.req{background:var(--card);border-radius:14px;padding:12px 14px 4px;margin-bottom:16px}
.req>b{display:block;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.req .pts{margin-bottom:8px}
.crow{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.crow .btn+.btn{margin-top:0}
.box.hint{background:#EEF6D5}
.box.hint>b{color:#5A7A00}
.box.sol{background:var(--card);border:1.5px solid var(--line)}
.box.sol>b{color:var(--mute)}
.box.sol .code{margin:8px 0}
.rhead{font-weight:650;font-size:17px;margin:6px 0 8px;display:flex;align-items:center;gap:8px}
.rhead.ok{color:#4C7A00}
.rhead.ko{color:#B23A1C}
.tlist{list-style:none;display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:14.5px}
.tlist li.ok{color:#3F6600}
.tlist li.ko{color:#B23A1C}
.tlist li{padding-left:1.3em;text-indent:-1.3em}
.tlist .errbox{margin-top:6px;color:var(--ink);text-indent:0}
.tdetail{background:var(--card);border-radius:14px;padding:12px 14px;font-size:14.5px;display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.tdetail code{font-family:'Geist Mono',monospace;font-size:13px;background:var(--bg);padding:1px 5px;border-radius:5px;word-break:break-all}
pre.code.small{font-size:12.5px;padding:10px 12px;margin:2px 0 6px;border-radius:10px;white-space:pre-wrap}
.errbox{background:var(--badbg);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14.5px}
.errbox>b{display:block;color:#B23A1C;font-family:'Geist Mono',monospace;font-size:13px;margin-bottom:2px;word-break:break-word}
.errbox .where{font-size:13.5px;margin:2px 0}
.errbox .tip{font-size:14.5px}
.errbox code{font-family:'Geist Mono',monospace;font-size:12.5px;background:rgba(0,0,0,.06);padding:1px 5px;border-radius:5px}
.out .errbox{font-family:'Geist',system-ui,sans-serif;white-space:normal}
.cmdwrap{position:relative}
.cmdwrap pre.code{padding-top:40px;white-space:pre-wrap;overflow-wrap:anywhere}
.copyb{position:absolute;top:8px;right:8px;background:#2B2D24;color:#E9EBE2;border-radius:8px;padding:5px 10px;font-size:12px;font-family:'Geist Mono',monospace}
textarea.ans{resize:vertical;margin-bottom:12px;min-height:52px;font-size:15px}
details.stdin{margin:0 0 12px;background:var(--card);border-radius:12px;padding:10px 14px}
details.stdin summary{cursor:pointer;font-size:14px;color:var(--mute)}
details.stdin textarea{margin-bottom:0}

/* finestre e avvisi */
.modal{position:fixed;inset:0;z-index:30;background:rgba(18,19,16,.45);display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:85dvh;overflow-y:auto;border-radius:24px 24px 0 0;padding:24px 20px calc(env(safe-area-inset-bottom) + 20px);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{font-size:26px;letter-spacing:-.03em;margin-bottom:4px}
.cl{margin:18px 0}
.cl h4{font-family:'Geist Mono',monospace;font-size:12px;color:var(--mute);font-weight:500;margin-bottom:6px}
.cl ul{padding-left:18px;font-size:15px;display:flex;flex-direction:column;gap:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:40;background:var(--ink);color:#fff;border-radius:14px;padding:12px 12px 12px 16px;display:flex;gap:12px;align-items:center;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.2);max-width:calc(100% - 32px);animation:up .25s ease-out}
.toast .btn{background:var(--acc);color:var(--ink)}

.hidden{display:none!important}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.97);opacity:0}100%{transform:none;opacity:1}}

/* tablet e PC */
@media (min-width:900px){
  .app{max-width:none;margin:0 0 0 var(--side);padding:32px 48px 60px}
  .app>*{max-width:760px}
  .chips{margin:0 0 18px;padding:0 0 2px;flex-wrap:wrap}
  .nav{top:0;bottom:0;right:auto;width:var(--side);border-top:0;border-right:1px solid var(--line);padding:28px 14px;background:var(--bg)}
  .nav-in{flex-direction:column;gap:4px;max-width:none}
  .nav .side-brand{display:flex;font-weight:700;font-size:21px;letter-spacing:-.03em;align-items:center;gap:8px;padding:0 12px 24px}
  .nav .side-brand svg{width:24px;height:24px}
  .nav .nb{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:11px 12px;border-radius:12px;justify-content:flex-start}
  .nav .nb.on{background:var(--card)}
  .nav .cnt{position:static;margin-left:auto}
  .top .brand{visibility:hidden}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .grid2>.card,.grid2>.sess{margin-bottom:0}
  .kb{display:inline-block}
  .modal{align-items:center}
  .sheet{border-radius:24px}
  .toast{bottom:28px;left:calc(50% + var(--side)/2)}
  .badges{grid-template-columns:repeat(4,1fr)}
}

        { t: "info", title: "Come funziona una sfida", text: "Qui scrivi tu il codice da zero, come in un vero programma. Premi **Verifica**: un correttore automatico esegue il tuo codice su vari casi di prova e ti dice quali funzionano, cosa si aspettava e cosa ha ottenuto. Se c’è un errore, te lo spiega.\n\nSe sei bloccato, apri i **suggerimenti** uno alla volta. La **soluzione** si sblocca dopo un paio di tentativi: guardala solo alla fine, e poi riscrivila con parole tue.", points: ["Le sfide non consumano vite e non bloccano il percorso: puoi farle quando vuoi.", "Il codice resta salvato anche se chiudi la lezione.", "Se non la completi, o se hai dovuto guardare la soluzione, la ritrovi nel Ripasso tra le “sfide da riprovare”: rifalla da solo dopo qualche giorno."] },
        {
          t: "code",
          q: "Temperatura di melting",
          mode: "func",
          func: "tm",
          text: "La **temperatura di melting** (Tm) di un primer è la temperatura a cui si stacca dal DNA. Per primer corti si stima con la *regola di Wallace*:\n\nTm = 2 × (numero di A + numero di T) + 4 × (numero di G + numero di C)",
          points: ["Scrivi la funzione `tm(primer)` che **restituisce** (con `return`) la Tm come numero intero.", "Deve funzionare anche se il primer è scritto in minuscolo."],
          starter: `def tm(primer):
    # scrivi qui il tuo codice
    pass
`,
          tests: [
            {"call":"tm(\"ATGC\")","expect":"12"},
            {"call":"tm(\"GGGG\")","expect":"16"},
            {"call":"tm(\"AAAA\")","expect":"8"},
            {"call":"tm(\"atgc\")","expect":"12","desc":"minuscole"},
            {"call":"tm(\"ATGCATGCATGC\")","expect":"36"}
          ],
          hints: ["Conta ogni base con il metodo `count`: `primer.count(\"A\")` restituisce quante A ci sono.", "Per gestire le minuscole, all’inizio converti tutto in maiuscolo: `primer = primer.upper()`.", "Calcola `at = …` e `gc = …`, poi `return 2 * at + 4 * gc`. Ricorda: `return`, non `print`."],
          solution: `def tm(primer):
    primer = primer.upper()
    at = primer.count("A") + primer.count("T")
    gc = primer.count("G") + primer.count("C")
    return 2 * at + 4 * gc
`,
          why: "Prima si normalizza con `upper()`, poi si contano le basi e si applica la formula. La funzione restituisce il valore, così chi la chiama può usarlo."
        },
        {
          t: "code",
          q: "Classifica il contenuto GC",
          mode: "func",
          func: "classifica_gc",
          text: "Il contenuto GC è la frazione di basi G o C: (G + C) / lunghezza. Scrivi una funzione che classifica una sequenza in base al GC.",
          points: ["`classifica_gc(seq)` restituisce la stringa `\"basso\"` se il GC è minore di 0.4,", "`\"medio\"` se è tra 0.4 e 0.6, **estremi compresi**,", "`\"alto\"` se è maggiore di 0.6.", "Deve funzionare anche con le minuscole."],
          starter: `def classifica_gc(seq):
    pass
`,
          tests: [
            {"call":"classifica_gc(\"ATAT\")","expect":"\"basso\""},
            {"call":"classifica_gc(\"ATGC\")","expect":"\"medio\""},
            {"call":"classifica_gc(\"GGGC\")","expect":"\"alto\""},
            {"call":"classifica_gc(\"AATTGGCCAT\")","expect":"\"medio\"","desc":"GC esattamente 0.4 → \"medio\""},
            {"call":"classifica_gc(\"GGGCCCAAAA\")","expect":"\"medio\"","desc":"GC esattamente 0.6 → \"medio\""},
            {"call":"classifica_gc(\"ggcc\")","expect":"\"alto\"","desc":"minuscole"}
          ],
          hints: ["Calcola prima il GC: `gc = (seq.count(\"G\") + seq.count(\"C\")) / len(seq)`, dopo aver fatto `upper()`.", "Usa `if`, `elif`, `else`. Attento ai bordi: 0.4 e 0.6 sono “medio”.", "Se il primo controllo è `gc < 0.4`, nel secondo basta `gc <= 0.6`: se arrivi lì, sai già che gc è almeno 0.4."],
          solution: `def classifica_gc(seq):
    seq = seq.upper()
    gc = (seq.count("G") + seq.count("C")) / len(seq)
    if gc < 0.4:
        return "basso"
    elif gc <= 0.6:
        return "medio"
    else:
        return "alto"
`,
          why: "I rami di un `if/elif/else` si controllano in ordine: arrivati all’`elif` sai già che `gc` non è minore di 0.4, quindi basta controllare il limite superiore. Gli esercizi “ai bordi” (0.4 e 0.6) sono quelli dove si sbaglia più spesso."
        }
    ]}
  ]},

  { title: "Settimana 7 · Espressioni regolari", lessons: [
    { id: "p7a", title: "re.search", sub: "Pattern di testo", ex: [
        { t: "info", title: "Cos’è un’espressione regolare", text: "Un’**espressione regolare** (*regex*) è un modello che descrive un insieme di stringhe: “inizia con ATG”, “un indirizzo email”, “solo cifre”. Il modulo `re` le usa per cercare, controllare ed estrarre testo.\n\n`re.search(pattern, testo)` cerca il pattern **in qualsiasi punto** del testo. Restituisce un oggetto *match* se lo trova, altrimenti `None`, quindi si può usare direttamente in un `if`.", code: `import re
seq = "GCTATAAAG"
if re.search(r"TATA", seq):
    print("TATA box trovata")` },
        { t: "info", title: "I simboli principali", text: "Nelle regex alcuni caratteri hanno un significato speciale:", points: ["`.` qualsiasi carattere (tranne l’a capo)", "`*` zero o più ripetizioni del precedente; `+` una o più; `?` zero o una", "`{n}` esattamente n volte; `{n,m}` da n a m volte", "`^` inizio della stringa; `$` fine della stringa", "`\\d` una cifra; `\\w` lettera, cifra o `_`; `\\s` spazio", "`[ACGT]` uno qualsiasi dei caratteri elencati; `[^0-9]` uno qualsiasi **tranne** quelli", "`a|b` una cosa o l’altra; `\\.` un punto vero (il `\\` toglie il significato speciale)"], code: `import re
print(bool(re.search(r"^ATG", "ATGCCC")))   # True: inizia con ATG
print(bool(re.search(r"A+$", "CCAAA")))     # True: finisce con una o più A
email = "malan@harvard.edu"
print(bool(re.search(r"^\\w+@\\w+\\.edu$", email)))   # True` },
        { t: "mc", q: "In una regex, cosa indica ^?", opts: ["L’inizio della stringa", "La fine della stringa", "Qualsiasi carattere"], a: 0, why: "$ indica la fine." },
        { t: "mc", q: "Cosa riconosce A+?", opts: ["Una o più A", "Zero o più A", "Esattamente una A"], mono: 1, a: 0, why: "+ significa “almeno una volta”." },
        { t: "fill", q: "Cerca il motivo nella sequenza.", code: `if re.___(r"TATA", seq):
    print("TATA box")`, bank: ["search", "find", "grep"], ans: ["search"], why: "re.search restituisce un match o None." },
        { t: "info", title: "Perché r\"...\"", text: "Nelle stringhe normali Python interpreta `\\` come inizio di un carattere speciale (`\"\\n\"` è l’a capo). Le regex usano molti `\\` (`\\d`, `\\w`, `\\.`). Con una **stringa raw**, `r\"...\"`, Python lascia i backslash così come sono e li passa intatti a `re`.\n\nRegola semplice: scrivi le regex sempre come `r\"...\"`." },
        { t: "mc", q: "Perché si scrive r\"...\" per le regex?", opts: ["È una stringa raw: Python non interpreta i backslash", "Rende la regex più veloce", "È obbligatorio"], a: 0, why: "Così \\w arriva intatto al motore delle regex." },
        { t: "type", q: "Scrivi cosa stampa.", code: `import re
print(bool(re.search(r"^ATG", "ATGCCC")))`, ans: ["True"], why: "La stringa inizia con ATG." }
    ]},
    { id: "p7b", title: "Gruppi e motivi", sub: "finditer, group, sub", ex: [
        { t: "info", title: "Classi di caratteri", text: "Le parentesi quadre definiscono un **insieme** di caratteri ammessi in quella posizione: `[ACGT]` riconosce **un** carattere tra A, C, G e T. Con `-` indichi un intervallo: `[0-9]`, `[A-Z]`.", code: `import re
print(re.findall(r"[GC]", "ATGCGA"))   # ['G', 'C', 'G']` },
        { t: "mc", q: "Cosa riconosce [ACGT]?", opts: ["Uno qualsiasi tra A, C, G, T", "La stringa \"ACGT\"", "Nessuna base"], mono: 1, a: 0, why: "Le parentesi quadre definiscono un insieme di caratteri." },
        { t: "info", title: "Gruppi: estrarre pezzi", text: "Le parentesi tonde creano un **gruppo**: una parte del pattern che puoi poi estrarre. Dal match, `m.group(1)` restituisce il testo del primo gruppo, `m.group(2)` del secondo, e `m.group()` tutto il match.\n\n`(?:...)` è un gruppo *non catturante*: raggruppa (ad esempio per ripetere) ma non viene salvato.", code: `import re
m = re.search(r"(\\w+)@(\\w+)\\.edu", "malan@harvard.edu")
print(m.group(1))   # malan
print(m.group(2))   # harvard` },
        { t: "fill", q: "Estrai il primo gruppo.", code: `m = re.search(r"(\\w+)@", email)
utente = m.___(1)`, bank: ["group", "get", "match"], ans: ["group"], why: "group(1) restituisce ciò che è tra le prime parentesi." },
        { t: "info", title: "findall, finditer e sub", text: "Oltre a `search`:", points: ["`re.findall(p, s)` restituisce la **lista** di tutti i match (che non si sovrappongono).", "`re.finditer(p, s)` restituisce i match uno alla volta: con `m.start()` sai dove si trovano.", "`re.sub(p, nuovo, s)` sostituisce ogni match con `nuovo`."], code: `import re
seq = "CCGAATTCGGGAATTCA"
print([m.start() for m in re.finditer("GAATTC", seq)])   # [2, 10]
print(re.findall(r"A{2}", "AAAA"))      # ['AA', 'AA']
print(re.sub(r"T", "U", "ATTG"))        # AUUG` },
        { t: "mc", q: "Cosa restituisce re.findall(r\"A{2}\", \"AAAA\")?", opts: ["[\"AA\", \"AA\"]", "[\"AAAA\"]", "[\"A\", \"A\", \"A\", \"A\"]"], mono: 1, a: 0, why: "{2} = esattamente due volte; i match non si sovrappongono." },
        { t: "type", q: "Scrivi cosa stampa.", code: `import re
print(re.sub(r"T", "U", "ATTG"))`, ans: ["AUUG"], why: "re.sub sostituisce ogni match." },
        { t: "info", title: "Avido e non avido", text: "`*` e `+` sono **avidi**: prendono più testo possibile. Aggiungendo `?` (`*?`, `+?`) diventano **non avidi** e si fermano appena possono.\n\nPer un ORF (open reading frame, dal codone di start ATG al primo codone di stop) ti serve proprio il primo stop: `ATG(?:...)*?(?:TAA|TAG|TGA)` prende triplette (`...` = tre caratteri qualsiasi) il meno possibile, fino al primo stop nello stesso frame di lettura.", code: `import re
s = "ATGAAATAGCCCTAA"
print(re.search(r"ATG(?:...)*(?:TAA|TAG|TGA)", s).group())    # avido: fino all'ultimo stop
print(re.search(r"ATG(?:...)*?(?:TAA|TAG|TGA)", s).group())   # non avido: ATGAAATAG` },
        { t: "mc", q: "Quale regex trova un ATG seguito da codoni fino a uno stop?", opts: ["ATG(?:...)*?(?:TAA|TAG|TGA)", "ATG*TAA", "^TAA$"], mono: 1, a: 0, why: "(?:...)*? prende triplette in modo non avido fino al primo stop." }
    ]},

        { t: "info", title: "Come funziona una sfida", text: "Qui scrivi tu il codice da zero, come in un vero programma. Premi **Verifica**: un correttore automatico esegue il tuo codice su vari casi di prova e ti dice quali funzionano, cosa si aspettava e cosa ha ottenuto. Se c’è un errore, te lo spiega.\n\nSe sei bloccato, apri i **suggerimenti** uno alla volta. La **soluzione** si sblocca dopo un paio di tentativi: guardala solo alla fine, e poi riscrivila con parole tue.", points: ["Le sfide non consumano vite e non bloccano il percorso: puoi farle quando vuoi.", "Il codice resta salvato anche se chiudi la lezione.", "Se non la completi, o se hai dovuto guardare la soluzione, la ritrovi nel Ripasso tra le “sfide da riprovare”: rifalla da solo dopo qualche giorno."] },

          hints: ["Scorri le righe con `for riga in f:` e togli l’a capo con `riga = riga.strip()`. Se la riga è vuota, `continue`.", "Se la riga inizia con `>`: `nome = riga[1:].split()[0]` e `lunghezze[nome] = 0`.", "Altrimenti aggiungi la lunghezza della riga alla sequenza corrente: `lunghezze[nome] += len(riga)`."],

  { title: "Settimana 8 · Programmazione a oggetti", lessons: [
    { id: "p8a", title: "Classi", sub: "class, __init__, self", ex: [
        { t: "info", title: "Classi e oggetti", text: "Una **classe** è uno stampo per creare **oggetti** di un tipo nuovo, che hai inventato tu. Ogni oggetto ha i suoi dati (**attributi**) e le funzioni che lavorano su quei dati (**metodi**).\n\n`__init__` è il metodo speciale chiamato quando crei l’oggetto: lì imposti gli attributi. Il primo parametro di ogni metodo è `self`, cioè l’oggetto su cui stai lavorando; quando chiami `s.gc()`, Python passa `s` come `self`.", code: `class Sequenza:
    def __init__(self, nome, seq):
        self.nome = nome
        self.seq = seq.upper()

    def gc(self):
        return (self.seq.count("G") + self.seq.count("C")) / len(self.seq)

s = Sequenza("x", "ggat")   # crea l'oggetto: chiama __init__
print(s.nome, s.gc())       # x 0.5`, cpp: "`self` è come `this`, ma va scritto esplicitamente come primo parametro, e per accedere agli attributi serve sempre `self.`. Non ci sono `public`/`private`: per convenzione un nome che inizia con `_` è “privato”." },
        { t: "mc", q: "Cos’è self?", opts: ["L’oggetto su cui si chiama il metodo", "Una variabile globale", "Il nome della classe"], a: 0, why: "s.gc() passa automaticamente s come self." },

        { t: "info", title: "Metodi speciali: __str__", text: "I metodi con doppio trattino basso prima e dopo (*dunder*, da *double underscore*) hanno un significato speciale per Python. `__str__` decide come appare l’oggetto quando lo stampi con `print` o lo converti con `str()`.", code: `class Gene:
    def __init__(self, nome):
        self.nome = nome
    def __str__(self):

print(Gene("TP53"))   # Gene TP53` },
        { t: "mc", q: "A cosa serve __str__?", opts: ["Definisce come appare l’oggetto con print()", "Confronta oggetti", "Cancella l’oggetto"], a: 0, why: "print(obj) chiama obj.__str__()." },

    { id: "p8b", title: "Ereditarietà e proprietà", sub: "super, @property", ex: [
        { t: "info", title: "Ereditarietà", text: "Una classe può **ereditare** da un’altra: `class DNA(Sequenza):` significa che `DNA` ha automaticamente tutti gli attributi e i metodi di `Sequenza` (la classe *madre*), e può aggiungerne di nuovi o ridefinirli.\n\n`super()` dà accesso ai metodi della classe madre. Si usa spesso in `__init__` per non riscrivere il codice già presente lì.", code: `class Sequenza:
    def __init__(self, seq):

class RNA(Sequenza):

print(DNA("ATG").trascrivi().seq)   # AUG` },

        { t: "info", title: "Prima di iniziare", text: "Questo corso usa Python per lavorare con sequenze biologiche. Ti bastano le basi delle **Settimane 0–2** del corso Python: variabili, stringhe, `if`, cicli e funzioni. Ogni lezione ripassa comunque quello che serve.\n\nPer la biologia: il **DNA** è una catena di quattro **basi** (o nucleotidi), indicate con le lettere `A` (adenina), `C` (citosina), `G` (guanina) e `T` (timina). Una sequenza di DNA si scrive quindi come una parola fatta di queste quattro lettere." },
        { t: "info", title: "Una sequenza è una stringa", text: "Per Python una sequenza di DNA è semplicemente una **stringa**. Valgono quindi tutti gli strumenti delle stringhe:", points: ["`len(dna)`: lunghezza in basi (in biologia si dice *bp*, coppie di basi).", "`dna.count(\"A\")`: quante volte compare una base o una sottosequenza.", "`\"TATA\" in dna`: `True` se la sottosequenza è presente.", "`dna.upper()`: tutto in maiuscolo."], code: `dna = "atgcgtaa".upper()
print(dna)              # ATGCGTAA
print(len(dna))         # 8
print(dna.count("A"))   # 3
print("TATA" in "GCTATAAAG")   # True` },
        { t: "mc", q: "Quanto vale?", code: `"GATTACA".count("A")`, opts: ["2", "3", "4"], mono: 1, a: 1, why: "G-A-T-T-A-C-A: tre A." },
        { t: "fill", q: "Stampa la lunghezza della sequenza.", code: `print(___(dna))`, bank: ["len", "size", "count"], ans: ["len"], why: "len() restituisce il numero di caratteri." },
        { t: "info", title: "Perché normalizzare le maiuscole", text: "Nei file dei genomi le lettere minuscole hanno spesso un significato: indicano regioni **ripetute** (si dice *soft-masking*). Per Python però `\"a\"` e `\"A\"` sono caratteri diversi, e `count(\"A\")` non conta le `a` minuscole.\n\nPer questo, prima di analizzare una sequenza, di solito la si converte tutta in maiuscolo con `upper()`.", code: `seq = "ATGaaaTGA"
print(seq.count("A"))           # 2: le 'a' minuscole non contano
print(seq.upper().count("A"))   # 5` },
        { t: "mc", q: "Perché si usa .upper() prima di analizzare una sequenza?", opts: ["Rende il codice più veloce", "I file mescolano maiuscole e minuscole (es. regioni soft-masked)", "Python accetta solo maiuscole"], a: 1, why: "Nei genomi le minuscole indicano spesso regioni ripetute (soft-masking): normalizzare evita conteggi sbagliati." },
        { t: "mc", q: "Cosa restituisce?", code: `"TATA" in "GCTATAAAG"`, opts: ["True", "False", "2"], mono: 1, a: 0, why: "in verifica se una sottostringa è presente, come un motivo TATA box." },
        { t: "type", q: "Scrivi cosa stampa.", code: `print("acgt".upper().count("G"))`, ans: ["1"], why: "ACGT contiene una sola G." }
    ]},
    { id: "b2", title: "Contenuto GC", sub: "La prima metrica di ogni genoma", ex: [
        { t: "info", title: "Cos’è il contenuto GC", text: "Nella doppia elica le basi si appaiano: `A` con `T` (due legami a idrogeno), `G` con `C` (tre legami). Le regioni ricche di G e C sono quindi più stabili.\n\nIl **contenuto GC** è la frazione di basi che sono G o C. Cambia molto tra specie: è una delle prime cose che si misurano su un genoma.\n\n`GC = (numero di G + numero di C) / lunghezza`. Moltiplicando per 100 ottieni la percentuale." },
        { t: "info", title: "Calcolarlo in Python", text: "Si contano G e C con `count`, si sommano e si divide per la lunghezza. Attenzione al tipo di divisione: serve `/`, che dà un decimale.", code: `seq = "ATGCGCGA"
g_c = seq.count("G") + seq.count("C")   # 5
gc = g_c / len(seq)                     # 5 / 8
print(gc)                               # 0.625
print(round(gc * 100, 1))               # 62.5 (%)`, note: "Con `//` (divisione intera) otterresti `0`: è un errore facile da fare." },
        { t: "mc", q: "Qual è il GC% di \"GGCC\"?", opts: ["50", "100", "0"], mono: 1, a: 1, why: "Tutte e quattro le basi sono G o C." },
        { t: "fill", q: "Completa il calcolo.", code: `gc = (seq.count("G") + seq.count("C")) ___ len(seq)`, bank: ["/", "//", "*"], ans: ["/"], why: "// è la divisione intera: darebbe 0 invece di una frazione." },
        { t: "type", q: "Scrivi cosa stampa.", code: `seq = "ATAT"
print((seq.count("G") + seq.count("C")) / len(seq))`, ans: ["0.0"], why: "Nessuna G o C: 0 / 4 = 0.0." },
        { t: "info", title: "Trasformarlo in funzione", text: "Il calcolo diventa una funzione riutilizzabile: riceve una sequenza e **restituisce** il GC. Dentro conviene normalizzare con `upper()`, così funziona anche con le minuscole.", code: `def gc_content(seq):
    seq = seq.upper()
    g_c = seq.count("G") + seq.count("C")
    return g_c / len(seq)

print(gc_content("ggcc"), gc_content("ATAT"))   # 1.0 0.0` },
        { t: "order", q: "Scrivi la funzione gc_content.", lines: ["def gc_content(seq):", "    seq = seq.upper()", "    g_c = seq.count(\"G\") + seq.count(\"C\")", "    return g_c / len(seq)"], why: "Normalizza, conta, poi dividi per la lunghezza." }
    ]},
    { id: "b3", title: "Complemento inverso", sub: "Dizionari e reversed", ex: [
        { t: "info", title: "I due filamenti del DNA", text: "Il DNA è formato da due filamenti appaiati: dove su uno c’è `A`, sull’altro c’è `T`, e dove c’è `G` c’è `C`. Questa regola si chiama **complementarità**.\n\nI due filamenti corrono in **direzioni opposte**: per convenzione si legge ogni filamento da 5′ a 3′. Per ottenere la sequenza dell’altro filamento, letta nel suo verso, servono due passaggi:", points: ["**complementare** ogni base (A↔T, C↔G);", "**invertire** l’ordine."], code: `# filamento:              5' A T G C 3'
# complementare:          3' T A C G 5'
# letto nel suo verso:    5' G C A T 3'   <- complemento inverso` },
        { t: "info", title: "Un dizionario per il complemento", text: "Un dizionario è perfetto per associare ogni base al suo complemento: `comp[\"G\"]` restituisce `\"C\"`.\n\nPer invertire una stringa ci sono due modi: `reversed(seq)` restituisce le basi dall’ultima alla prima, oppure lo slicing con passo negativo `seq[::-1]`.\n\nPer rimettere insieme i caratteri in una stringa si usa `\"\".join(...)`: unisce gli elementi usando come separatore la stringa iniziale, qui vuota.", code: `comp = {"A": "T", "T": "A", "C": "G", "G": "C"}
seq = "ATGC"
rc = "".join(comp[b] for b in reversed(seq))
print(rc)                # GCAT
print(seq[::-1])         # CGTA (solo invertita)
print("".join(["A", "T", "G"]))   # ATG` },
        { t: "mc", q: "Qual è il complemento inverso di AAGC?", opts: ["TTCG", "GCTT", "CGAA"], mono: 1, a: 1, why: "Inverti (CGAA) e complementa (GCTT). TTCG è solo il complemento." },
        { t: "fill", q: "Inverti la stringa con lo slicing.", code: `rev = seq[___]`, bank: ["::-1", "-1", "::1"], ans: ["::-1"], why: "Il passo -1 percorre la stringa al contrario." },
        { t: "mc", q: "Cosa restituisce comp[\"G\"]?", code: `comp = {"A": "T", "T": "A", "C": "G", "G": "C"}`, opts: ["C", "G", "T"], mono: 1, a: 0, why: "Un dizionario restituisce il valore associato alla chiave." },
        { t: "mc", q: "Cosa restituisce?", code: `"".join(["A", "T", "G"])`, opts: ["\"A T G\"", "\"ATG\"", "[\"A\",\"T\",\"G\"]"], mono: 1, a: 1, why: "join unisce gli elementi usando la stringa iniziale (vuota) come separatore." },
        { t: "type", q: "Scrivi cosa stampa.", code: `print("ATTG"[::-1])`, ans: ["GTTA"], why: "Lo slicing con passo -1 inverte la stringa." }
    ]},
    { id: "b3s", kind: "sfida", title: "Sfida · Sequenze", sub: "Un complemento inverso robusto", ex: [
        { t: "info", title: "Come funziona una sfida", text: "Qui scrivi tu il codice da zero, come in un vero programma. Premi **Verifica**: un correttore automatico esegue il tuo codice su vari casi di prova e ti dice quali funzionano, cosa si aspettava e cosa ha ottenuto. Se c’è un errore, te lo spiega.\n\nSe sei bloccato, apri i **suggerimenti** uno alla volta. La **soluzione** si sblocca dopo un paio di tentativi: guardala solo alla fine, e poi riscrivila con parole tue.", points: ["Le sfide non consumano vite e non bloccano il percorso: puoi farle quando vuoi.", "Il codice resta salvato anche se chiudi la lezione.", "Se non la completi, o se hai dovuto guardare la soluzione, la ritrovi nel Ripasso tra le “sfide da riprovare”: rifalla da solo dopo qualche giorno."] },
        {
          t: "code",
          q: "Complemento inverso robusto",
          mode: "func",
          func: "revcomp",
          text: "Nei file reali le sequenze possono contenere minuscole e la lettera `N` (base sconosciuta). Scrivi un complemento inverso che le gestisce, e che rifiuta i caratteri non validi.",
          points: ["`revcomp(seq)` restituisce il complemento inverso in **maiuscolo**.", "`N` resta `N`.", "Se trova un carattere diverso da A, C, G, T, N solleva `ValueError`.", "Una sequenza vuota dà una stringa vuota."],
          starter: `COMP = {"A": "T", "T": "A", "C": "G", "G": "C", "N": "N"}


def revcomp(seq):
    pass
`,
          tests: [
            {"call":"revcomp(\"ATGC\")","expect":"\"GCAT\""},
            {"call":"revcomp(\"atgc\")","expect":"\"GCAT\"","desc":"minuscole"},
            {"call":"revcomp(\"ANNT\")","expect":"\"ANNT\"","desc":"le N restano N"},
            {"call":"revcomp(\"\")","expect":"\"\"","desc":"sequenza vuota"},
            {"call":"revcomp(\"ATGX\")","raises":"ValueError","desc":"carattere non valido → ValueError"}
          ],
          hints: ["Scorri le basi al contrario: `for b in reversed(seq.upper()):`.", "Prima di usare `COMP[b]`, controlla `if b not in COMP:` e in quel caso `raise ValueError(\"base non valida\")`.", "Costruisci il risultato aggiungendo una lettera alla volta: `risultato += COMP[b]`."],
          solution: `COMP = {"A": "T", "T": "A", "C": "G", "G": "C", "N": "N"}


def revcomp(seq):
    risultato = ""
    for b in reversed(seq.upper()):
        if b not in COMP:
            raise ValueError(f"base non valida: {b}")
        risultato += COMP[b]
    return risultato
`,
          why: "Senza il controllo, un carattere strano causerebbe un `KeyError` poco chiaro. Sollevare un `ValueError` con un messaggio preciso aiuta chi usa la funzione a capire cosa non va."
        }
    ]}
  ]},
  { title: "Dal gene alla proteina", lessons: [
    { id: "b4", title: "Trascrizione e traduzione", sub: "replace, range e codoni", ex: [
        { t: "info", title: "Dal DNA alla proteina", text: "Il **dogma centrale** della biologia molecolare: il DNA viene **trascritto** in RNA, e l’RNA (messaggero) viene **tradotto** in proteina.", points: ["**Trascrizione**: l’RNA ha la stessa sequenza del filamento codificante, ma con `U` (uracile) al posto di `T`.", "**Traduzione**: l’RNA si legge a gruppi di tre basi, i **codoni**. Ogni codone corrisponde a un amminoacido o a un segnale di stop.", "`AUG` è il **codone di inizio** (codifica la metionina, `M`); `UAA`, `UAG`, `UGA` sono i **codoni di stop**.", "I codoni possibili sono 4 × 4 × 4 = 64: la tabella che li associa agli amminoacidi si chiama **codice genetico**."] },
        { t: "info", title: "In Python: replace e passi di 3", text: "La trascrizione è una sostituzione: `dna.replace(\"T\", \"U\")`.\n\nPer dividere in codoni si scorre la sequenza **a passi di 3** con `range(0, len(rna), 3)` e si prende ogni volta una fetta di tre caratteri, `rna[i:i+3]`.", code: `dna = "ATGGCCTAA"
rna = dna.replace("T", "U")
print(rna)              # AUGGCCUAA
codoni = [rna[i:i+3] for i in range(0, len(rna), 3)]
print(codoni)           # ['AUG', 'GCC', 'UAA']` },
        { t: "mc", q: "Cosa restituisce?", code: `"ATGC".replace("T", "U")`, opts: ["AUGC", "UAGC", "ATGC"], mono: 1, a: 0, why: "replace sostituisce ogni T con U." },
        { t: "fill", q: "Scorri la sequenza un codone alla volta.", code: `for i in range(0, len(rna), ___):
    codone = rna[i:i+3]`, bank: ["3", "1", "2"], ans: ["3"], why: "Il passo 3 fa saltare da una tripletta alla successiva." },
        { t: "mc", q: "Cosa codifica AUG?", opts: ["Metionina (codone di start)", "Un codone di stop", "Triptofano"], a: 0, why: "AUG avvia la traduzione e codifica la metionina." },
        { t: "mc", q: "Quale di questi è un codone di stop?", opts: ["UAA", "AUG", "GCC"], mono: 1, a: 0, why: "I codoni di stop sono UAA, UAG e UGA." },
        { t: "info", title: "Tradurre con una tabella", text: "Se hai un dizionario `tabella` che associa ogni codone al suo amminoacido (una lettera), la traduzione è un ciclo: per ogni codone aggiungi la lettera corrispondente.\n\nIl `- 2` in `range(0, len(rna) - 2, 3)` evita di prendere un ultimo pezzo incompleto se la lunghezza non è multipla di 3.", code: `tabella = {"AUG": "M", "GCC": "A", "UAA": "*"}   # versione ridotta
rna = "AUGGCCUAA"
proteina = ""
for i in range(0, len(rna) - 2, 3):
    codone = rna[i:i+3]
    proteina += tabella[codone]
print(proteina)   # MA*  (* = stop)` },
        { t: "order", q: "Traduci l’RNA usando il dizionario tabella.", lines: ["proteina = \"\"", "for i in range(0, len(rna) - 2, 3):", "    codone = rna[i:i+3]", "    proteina += tabella[codone]"], why: "Inizializza, scorri a passi di 3, estrai il codone e aggiungi l’amminoacido." }
    ]},
    { id: "b5", title: "Leggere un FASTA", sub: "Il formato più comune", ex: [
        { t: "info", title: "Il formato FASTA", text: "**FASTA** è il formato di testo più usato per le sequenze. Ogni sequenza ha:", points: ["una riga di **intestazione** (*header*) che inizia con `>`, seguita da un identificativo e spesso da una descrizione;", "una o più righe con la **sequenza**. Le sequenze lunghe sono spezzate su più righe, spesso da 60–80 caratteri."], code: `>BRCA1 gene umano
ATGGATTTATCTGCTCTTCG
CGTTGAAGAAGTACAAAATG
>TP53 gene umano
ATGGAGGAGCCGCAGTCAGA` },
        { t: "info", title: "Leggerlo con Python", text: "Si legge riga per riga. Se la riga inizia con `>` è un nuovo header: si prende il nome (togliendo il `>` con `riga[1:]`) e si crea una voce vuota nel dizionario. Altrimenti è un pezzo di sequenza da **aggiungere** alla voce corrente.\n\n`splitlines()` divide un testo in righe; `startswith(\">\")` controlla l’inizio di una stringa.", code: `testo = """>seq1

        { t: "fill", q: "Riconosci le righe di header.", code: `if riga.___(">"):`, bank: ["startswith", "begins", "first"], ans: ["startswith"], why: "startswith() verifica l’inizio di una stringa." },
        { t: "mc", q: "Cosa restituisce?", code: `">BRCA1 human"[1:]`, opts: ["\"BRCA1 human\"", "\">BRCA1\"", "\"BRCA1\""], mono: 1, a: 0, why: "[1:] toglie solo il primo carattere, il \">\"." },
        { t: "mc", q: "Perché le righe di sequenza vanno concatenate?", opts: ["Le sequenze lunghe sono spezzate su più righe (spesso 60–80 caratteri)", "Per ordinare le basi", "Il FASTA vieta le righe lunghe"], a: 0, why: "Molti file FASTA vanno a capo a larghezza fissa." },
        { t: "info", title: "L’identificativo", text: "Per convenzione l’**identificativo** è la prima parola dell’header, prima del primo spazio; il resto è una descrizione libera. Per prenderlo: togli il `>` e dividi sugli spazi.", code: `header = ">gene1 umano cromosoma 17"

        { t: "type", q: "Scrivi cosa stampa.", code: `print(">gene1 umano"[1:].split()[0])`, ans: ["gene1"], why: "Togli \">\" e prendi la prima parola: è l’ID." }
    ]},
    { id: "b6", title: "Trovare un ORF", sub: "find e frame di lettura", ex: [
        { t: "info", title: "Frame di lettura e ORF", text: "Una sequenza si può leggere a codoni partendo dalla prima, dalla seconda o dalla terza base: sono i tre **frame di lettura**. Il filamento opposto ne ha altri tre, quindi un DNA a doppio filamento ne ha **6**.\n\nUn **ORF** (*Open Reading Frame*, cornice di lettura aperta) è un tratto che parte da un codone `ATG` e arriva al primo codone di stop **nello stesso frame**. Gli ORF lunghi sono candidati geni: in una sequenza casuale uno stop compare in media ogni 64/3 ≈ 21 codoni, quindi un ORF lungo difficilmente è un caso." },
        { t: "mc", q: "Quanti frame di lettura ha un DNA a doppio filamento?", opts: ["6", "3", "1"], a: 0, why: "3 frame sul filamento diretto e 3 sul complemento inverso." },
        { t: "info", title: "find: dov’è l’ATG?", text: "`seq.find(\"ATG\")` restituisce la **posizione** (indice) della prima occorrenza, oppure `-1` se non c’è. Da lì si scorre a passi di 3 fino al primo stop.", code: `seq = "CCATGAAATTTTAGCC"
start = seq.find("ATG")          # 2
for i in range(start, len(seq) - 2, 3):
    if seq[i:i+3] in ("TAA", "TAG", "TGA"):
        print(seq[start:i+3])    # ATGAAATTTTAG
        break
print("ACGT".find("TTT"))        # -1` },
        { t: "fill", q: "Trova la posizione del primo ATG.", code: `pos = seq.___("ATG")`, bank: ["find", "index0", "search"], ans: ["find"], why: "find restituisce l’indice del primo match, o -1." },
        { t: "type", q: "Scrivi cosa stampa.", code: `print("ACGT".find("TTT"))`, ans: ["-1"], why: "find restituisce -1 se non trova nulla." },
        { t: "mc", q: "Perché gli ORF lunghi sono interessanti?", opts: ["In una sequenza casuale (basi equiprobabili) uno stop compare circa ogni 21 codoni: un ORF lungo probabilmente codifica una proteina", "Sono sempre introni", "Hanno più GC"], a: 0, why: "3 codoni di stop su 64: in media uno ogni 64/3 ≈ 21 codoni. Nei genomi reali la composizione delle basi sposta un po’ questo numero." },
        { t: "info", title: "Contare i codoni", text: "Un ORF ha una lunghezza multipla di 3: dividendo la lunghezza per 3 con `//` ottieni il numero di codoni, stop compreso.", code: `orf = "ATGAAATAG"
print(len(orf) // 3)   # 3 codoni` },
        { t: "type", q: "Quanti codoni ci sono? Scrivi cosa stampa.", code: `print(len("ATGAAATAG") // 3)`, ans: ["3"], why: "9 basi / 3 = 3 codoni." }

        { t: "info", title: "Come funziona una sfida", text: "Qui scrivi tu il codice da zero, come in un vero programma. Premi **Verifica**: un correttore automatico esegue il tuo codice su vari casi di prova e ti dice quali funzionano, cosa si aspettava e cosa ha ottenuto. Se c’è un errore, te lo spiega.\n\nSe sei bloccato, apri i **suggerimenti** uno alla volta. La **soluzione** si sblocca dopo un paio di tentativi: guardala solo alla fine, e poi riscrivila con parole tue.", points: ["Le sfide non consumano vite e non bloccano il percorso: puoi farle quando vuoi.", "Il codice resta salvato anche se chiudi la lezione.", "Se non la completi, o se hai dovuto guardare la soluzione, la ritrovi nel Ripasso tra le “sfide da riprovare”: rifalla da solo dopo qualche giorno."] },

          points: ["`traduci(dna)` legge il DNA a codoni **dalla prima base**.", "Si ferma al primo codone di stop, che **non** va incluso nel risultato.", "Un ultimo pezzo di meno di 3 basi si ignora.", "Deve funzionare anche con le minuscole."],

          solution: `BASI = "TCAG"
AA = "FFLLSSSSYY**CC*WLLLLPPPPHHQQRRRRIIIMTTTTNNKKSSRRVVVVAAAADDEEGGGG"
TABELLA = {a + b + c: AA[16 * i + 4 * j + k]
           for i, a in enumerate(BASI)
           for j, b in enumerate(BASI)
           for k, c in enumerate(BASI)}


def traduci(dna):
    dna = dna.upper()
    proteina = ""

  { title: "Confrontare sequenze", lessons: [
    { id: "b7", title: "Mutazioni e Hamming", sub: "zip e confronti", ex: [
        { t: "info", title: "Mutazioni puntiformi", text: "Una **mutazione puntiforme** (o sostituzione, o *SNP* se è una variante comune) cambia una sola base. Si distinguono:", points: ["**transizioni**: purina ↔ purina (A ↔ G) o pirimidina ↔ pirimidina (C ↔ T);", "**transversioni**: purina ↔ pirimidina (es. A ↔ C)."], code: `# purine: A, G      pirimidine: C, T
# A -> G  transizione
# A -> T  transversione` },
        { t: "info", title: "zip: scorrere due sequenze insieme", text: "`zip(a, b)` accoppia gli elementi che stanno nella stessa posizione: il primo con il primo, il secondo con il secondo… È perfetto per confrontare due sequenze lettera per lettera.", code: `for x, y in zip("ACGT", "AGGT"):
    print(x, y, x != y)
# A A False / C G True / G G False / T T False` },
        { t: "mc", q: "Cosa produce zip(\"AC\", \"AG\")?", opts: ["(\"A\", \"A\"), (\"C\", \"G\")", "\"AACG\"", "Errore"], mono: 1, a: 0, why: "zip accoppia gli elementi alla stessa posizione." },
        { t: "info", title: "La distanza di Hamming", text: "La **distanza di Hamming** tra due sequenze di uguale lunghezza è il numero di posizioni in cui sono diverse. Si calcola sommando i confronti `x != y`: in Python `True` vale `1` e `False` vale `0`, quindi `sum` li conta.", code: `a = "GAGCCTACTAACGGGAT"
b = "CATCGTAATGACGGCCT"
d = sum(x != y for x, y in zip(a, b))
print(d)            # 7
print(True + True)  # 2` },
        { t: "type", q: "Scrivi cosa stampa.", code: `print(sum(x != y for x, y in zip("AAAA", "AATA")))`, ans: ["1"], why: "Differiscono solo in posizione 2." },
        { t: "mc", q: "Una mutazione A→G è…", opts: ["Una transizione (purina → purina)", "Una transversione", "Una delezione"], a: 0, why: "Transizioni: A↔G, C↔T. Transversioni: purina ↔ pirimidina." },
        { t: "fill", q: "Conta le posizioni diverse.", code: `d = sum(x ___ y for x, y in zip(a, b))`, bank: ["!=", "==", "is"], ans: ["!="], why: "Ogni True vale 1 nella somma." },
        { t: "mc", q: "Quanto vale True + True in Python?", opts: ["2", "True", "Errore"], mono: 1, a: 0, why: "bool è una sottoclasse di int: True vale 1." }
    ]},
    { id: "b8", title: "k-mer e motivi", sub: "Counter", ex: [
        { t: "info", title: "Cosa sono i k-mer", text: "Un **k-mer** è una sottosequenza di lunghezza `k`. Per esempio i 3-mer di `ATGCA` sono `ATG`, `TGC`, `GCA`: si fa scorrere una finestra di `k` lettere una posizione alla volta.\n\nIn una sequenza lunga `L` ci sono `L - k + 1` k-mer, perché l’ultimo parte dalla posizione `L - k`. Contarli serve per l’assemblaggio dei genomi, la ricerca di motivi ricorrenti e il controllo di qualità.", code: `seq = "ATGCA"
k = 3
kmers = [seq[i:i+k] for i in range(len(seq) - k + 1)]
print(kmers)   # ['ATG', 'TGC', 'GCA']` },
        { t: "mc", q: "Quanti k-mer ha una sequenza lunga L?", opts: ["L - k + 1", "L / k", "L × k"], a: 0, why: "L’ultimo k-mer parte dalla posizione L - k." },
        { t: "type", q: "Scrivi cosa stampa.", code: `seq = "AAAA"
print(len([seq[i:i+2] for i in range(len(seq) - 1)]))`, ans: ["3"], why: "4 - 2 + 1 = 3 k-mer: AA, AA, AA." },
        { t: "fill", q: "Completa l’intervallo dei k-mer.", code: `for i in range(len(seq) - k ___ 1):`, bank: ["+", "-", "*"], ans: ["+"], why: "len - k + 1 posizioni di partenza." },
        { t: "info", title: "Contare con Counter", text: "`Counter`, dal modulo `collections`, conta quante volte compare ogni elemento e restituisce una specie di dizionario elemento → conteggio. `most_common(n)` restituisce gli `n` più frequenti, con il loro conteggio.", code: `from collections import Counter
seq = "ACGTACGTAC"
k = 4
conteggi = Counter(seq[i:i+k] for i in range(len(seq) - k + 1))
print(conteggi["ACGT"])          # 2
print(conteggi.most_common(1))   # [('ACGT', 2)]` },
        { t: "mc", q: "Cosa fa Counter.most_common(3)?", opts: ["Restituisce i 3 elementi più frequenti con i conteggi", "Conta fino a 3", "Toglie i 3 più rari"], a: 0, why: "Restituisce una lista di coppie (elemento, conteggio)." }
    ]},
    { id: "b8s", kind: "sfida", title: "Sfida · Confrontare sequenze", sub: "Hamming e k-mer", ex: [
        { t: "info", title: "Come funziona una sfida", text: "Qui scrivi tu il codice da zero, come in un vero programma. Premi **Verifica**: un correttore automatico esegue il tuo codice su vari casi di prova e ti dice quali funzionano, cosa si aspettava e cosa ha ottenuto. Se c’è un errore, te lo spiega.\n\nSe sei bloccato, apri i **suggerimenti** uno alla volta. La **soluzione** si sblocca dopo un paio di tentativi: guardala solo alla fine, e poi riscrivila con parole tue.", points: ["Le sfide non consumano vite e non bloccano il percorso: puoi farle quando vuoi.", "Il codice resta salvato anche se chiudi la lezione.", "Se non la completi, o se hai dovuto guardare la soluzione, la ritrovi nel Ripasso tra le “sfide da riprovare”: rifalla da solo dopo qualche giorno."] },
        {
          t: "code",
          q: "Distanza di Hamming sicura",
          mode: "func",
          func: "hamming",
          text: "Scrivi la distanza di Hamming tra due sequenze, controllando che si possano confrontare.",
          points: ["`hamming(a, b)` restituisce il numero di posizioni diverse.", "Maiuscole e minuscole non contano (`\"a\"` è uguale ad `\"A\"`).", "Se le lunghezze sono diverse, solleva `ValueError`."],
          starter: `def hamming(a, b):
    pass
`,
          tests: [
            {"call":"hamming(\"GAGCCTACTAACGGGAT\", \"CATCGTAATGACGGCCT\")","expect":"7"},
            {"call":"hamming(\"ACGT\", \"acgt\")","expect":"0","desc":"maiuscole e minuscole"},
            {"call":"hamming(\"A\", \"G\")","expect":"1"},
            {"call":"hamming(\"\", \"\")","expect":"0"},
            {"call":"hamming(\"AC\", \"A\")","raises":"ValueError","desc":"lunghezze diverse → ValueError"}
          ],
          hints: ["Prima di tutto: `if len(a) != len(b): raise ValueError(\"lunghezze diverse\")`.", "Normalizza con `upper()` entrambe le sequenze.", "`sum(x != y for x, y in zip(a, b))` conta le posizioni diverse."],
          solution: `def hamming(a, b):
    if len(a) != len(b):
        raise ValueError("lunghezze diverse")
    a, b = a.upper(), b.upper()
    return sum(x != y for x, y in zip(a, b))
`,
          why: "`zip` si ferma alla sequenza più corta: senza il controllo sulle lunghezze, un confronto sbagliato passerebbe in silenzio. Meglio sollevare un errore esplicito."
        },
        {
          t: "code",
          q: "Il k-mer più frequente",
          mode: "func",
          func: "kmer_piu_frequente",
          text: "Scrivi una funzione che trova il k-mer che compare più volte in una sequenza.",
          points: ["`kmer_piu_frequente(seq, k)` restituisce il k-mer più frequente.", "In caso di parità, restituisce quello che viene **prima in ordine alfabetico**."],
          starter: `from collections import Counter


def kmer_piu_frequente(seq, k):
    pass
`,
          tests: [
            {"call":"kmer_piu_frequente(\"AAAAT\", 2)","expect":"\"AA\""},
            {"call":"kmer_piu_frequente(\"GATTACA\", 1)","expect":"\"A\""},
            {"call":"kmer_piu_frequente(\"ACGTACGTAC\", 4)","expect":"\"ACGT\"","desc":"parità: vince l’ordine alfabetico"},
            {"call":"kmer_piu_frequente(\"TTTGGGTTT\", 3)","expect":"\"TTT\""}
          ],
          hints: ["Conta i k-mer con `Counter(seq[i:i+k] for i in range(len(seq) - k + 1))`.", "Il conteggio massimo è `max(conteggi.values())`.", "Tra quelli con il conteggio massimo, `min(...)` dà il primo in ordine alfabetico: `min(km for km, n in conteggi.items() if n == massimo)`."],
          solution: `from collections import Counter


def kmer_piu_frequente(seq, k):
    conteggi = Counter(seq[i:i+k] for i in range(len(seq) - k + 1))
    massimo = max(conteggi.values())
    return min(km for km, n in conteggi.items() if n == massimo)
`,
          why: "`max` trova il valore più alto; poi si filtrano i k-mer che lo raggiungono e `min` sceglie il primo in ordine alfabetico. Gestire la parità in modo esplicito rende il risultato sempre lo stesso."
        }
    ]}
  ]},
  { title: "Strumenti reali", lessons: [
    { id: "b9", title: "Biopython", sub: "Seq e SeqIO", ex: [
        { t: "info", title: "Cos’è Biopython", text: "**Biopython** è una libreria, cioè un pacchetto di codice già scritto, per la bioinformatica in Python. Fa per te molte cose che finora hai scritto a mano: complemento inverso, traduzione con il codice genetico completo, lettura e scrittura di decine di formati.\n\nSi installa una volta dal terminale con `pip install biopython`; nel codice il modulo si chiama `Bio`.", code: `# nel terminale:  pip install biopython
import Bio
print(Bio.__version__)` },
        { t: "info", title: "L’oggetto Seq", text: "`Seq` rappresenta una sequenza. Si usa quasi come una stringa (`len`, indici, `count`), ma ha in più dei metodi biologici:", points: ["`.complement()` complemento; `.reverse_complement()` complemento inverso;", "`.transcribe()` DNA → RNA;", "`.translate()` traduzione con il codice genetico standard (`*` = stop)."], code: `from Bio.Seq import Seq
s = Seq("ATGGCCTAA")
print(s.reverse_complement())   # TTAGGCCAT
print(s.transcribe())           # AUGGCCUAA
print(s.translate())            # MA*
print(Seq("ATG").reverse_complement())   # CAT` },
        { t: "mc", q: "Cosa restituisce Seq(\"ATG\").reverse_complement()?", opts: ["CAT", "TAC", "GTA"], mono: 1, a: 0, why: "Il complemento è TAC; letto al contrario diventa CAT." },
        { t: "info", title: "Leggere file con SeqIO", text: "Il modulo `SeqIO` legge e scrive file di sequenze. `SeqIO.parse(file, formato)` restituisce i record uno alla volta. Ogni record (un oggetto `SeqRecord`) ha:", points: ["`rec.id`: l’identificativo (prima parola dell’header);", "`rec.description`: l’header completo;", "`rec.seq`: la sequenza, come oggetto `Seq`."], code: `from Bio import SeqIO
with open("geni.fa", "w") as f:
    f.write(">gene1 umano\\nATGGCCTAA\\n>gene2 topo\\nATGAAATAG\\n")

for rec in SeqIO.parse("geni.fa", "fasta"):
    print(rec.id, len(rec.seq), rec.seq.translate())` },
        { t: "fill", q: "Stampa l’identificativo del record.", code: `print(rec.___)`, bank: ["id", "header0", "name_id"], ans: ["id"], why: "rec.id è la prima parola dell’header." },
        { t: "mc", q: "Cosa restituisce Seq(\"ATGGCCTAA\").translate()?", opts: ["MA*", "MAK", "M"], mono: 1, a: 0, why: "ATG = M, GCC = A, TAA = stop (*)." },
        { t: "info", title: "Formati e scrittura", text: "Il secondo argomento di `SeqIO.parse` è il **formato**: `\"fasta\"`, `\"fastq\"` (read di sequenziamento con qualità), `\"genbank\"`, e molti altri.\n\n`SeqIO.write(lista_di_record, file, formato)` scrive i record su file: così puoi filtrare un FASTA e salvarne una parte.", code: `from Bio import SeqIO
corte = [r for r in SeqIO.parse("geni.fa", "fasta") if len(r.seq) < 1000]
SeqIO.write(corte, "corte.fa", "fasta")` },
        { t: "mc", q: "Quale formato passi a SeqIO per un file FASTQ?", opts: ["\"fastq\"", "\"fq-reads\"", "\"illumina\""], mono: 1, a: 0, why: "Il nome del formato è \"fastq\"." },
        { t: "order", q: "Salva solo le sequenze più lunghe di 1000 bp.", lines: ["from Bio import SeqIO", "lunghe = []", "for rec in SeqIO.parse(\"geni.fa\", \"fasta\"):", "    if len(rec.seq) > 1000:", "        lunghe.append(rec)", "SeqIO.write(lunghe, \"lunghe.fa\", \"fasta\")"], why: "Leggi, filtra, scrivi." }
    ]},
    { id: "b10", title: "Tabelle con pandas", sub: "Filtrare risultati", ex: [
        { t: "info", title: "Cos’è pandas", text: "**pandas** è la libreria più usata in Python per le **tabelle**, per esempio i risultati di un’analisi di espressione genica. Si installa con `pip install pandas` e per convenzione si importa con il nome corto `pd`.\n\nLa struttura principale è il **DataFrame**: una tabella con righe e colonne con un nome. Ogni colonna è una **Series**, una sequenza di valori dello stesso tipo.", code: `import pandas as pd
df = pd.DataFrame({
    "gene": ["TP53", "MYC", "EGFR"],
    "log2FC": [2.1, -1.4, 0.3],
})
print(df)
print(len(df))           # 3 righe
print(df["gene"])        # una colonna (Series)` },
        { t: "info", title: "Leggere file e guardare i dati", text: "`pd.read_csv(\"file.csv\")` legge un CSV; per un file separato da tab aggiungi `sep=\"\\t\"`.\n\n`df.head()` mostra le prime **5** righe: è il modo rapido per controllare cosa hai caricato. `df.columns` elenca le colonne, `df.shape` dà (righe, colonne).", code: `import pandas as pd
with open("deg.tsv", "w") as f:
    f.write("gene\\tlog2FC\\tpadj\\nTP53\\t2.1\\t0.001\\nMYC\\t-1.4\\t0.03\\nEGFR\\t0.3\\t0.6\\n")

df = pd.read_csv("deg.tsv", sep="\\t")
print(df.head())
print(df.shape)     # (3, 3)` },
        { t: "mc", q: "Quante righe mostra df.head() in pandas?", opts: ["5", "6", "Tutte"], a: 0, why: "In pandas 5; head() di R ne mostra 6." },
        { t: "fill", q: "Leggi un file separato da tab.", code: `df = pd.read_csv("dati.tsv", sep=___)`, bank: ["\"\\t\"", "\",\"", "tab"], ans: ["\"\\t\""], why: "\\t è il carattere di tabulazione." },
        { t: "info", title: "Filtrare le righe", text: "Un confronto su una colonna produce una **maschera**: una colonna di `True`/`False`, una per riga. Mettendola tra parentesi quadre tieni solo le righe `True`.\n\nPer combinare più condizioni si usano `&` (e), `|` (o), `~` (non), con **ogni condizione tra parentesi**. `and`/`or` non funzionano qui: lavorano su un singolo vero/falso, non su intere colonne.", code: `sig = df[(df["padj"] < 0.05) & (df["log2FC"].abs() > 1)]

v = pd.DataFrame({"cromosoma": ["1", "1", "2"], "qualita": [50, 30, 40]})
