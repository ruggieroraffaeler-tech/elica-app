  tag: "Statistica, tidyverse e Bioconductor per l’analisi dei dati omici.",
  units: [
  { title: "Le basi di R", lessons: [
    { id: "r1", title: "Vettori", sub: "c(), <- e indici da 1", ex: [
        { t: "info", title: "Cos’è R e come si usa", text: "**R** è un linguaggio pensato per la statistica e l’analisi dei dati, molto usato in biologia (espressione genica, statistica, grafici).\n\nPuoi usarlo in due modi:", points: ["nella **console**: scrivi un’istruzione, premi Invio e vedi subito il risultato (è il modo più comodo per provare);", "in uno **script**, un file `.R` con tante istruzioni, eseguito dall’inizio con `Rscript analisi.R` dal terminale o dentro RStudio.", "Molti usano **RStudio**, un programma che mette insieme console, editor, grafici e aiuto.", "`#` inizia un commento: R ignora il resto della riga.", "`?mean` apre l’aiuto della funzione `mean`."], note: "In R le istruzioni non finiscono con `;` e i nomi distinguono maiuscole e minuscole: `Mean` non è `mean`." },
        { t: "info", title: "Assegnare valori e i vettori", text: "In R si assegna con la freccia `<-` (si legge “prende”): `x <- 5`. Funziona anche `=`, ma per convenzione si usa `<-`.\n\nIl dato fondamentale di R è il **vettore**: una sequenza di valori **dello stesso tipo**. Anche un numero da solo è un vettore lungo 1. La funzione `c()` (*combine*) crea un vettore unendo dei valori.", code: `espr <- c(2.1, 5.4, 3.3)     # vettore numerico
geni <- c("TP53", "MYC")      # vettore di testo (character)
ok   <- c(TRUE, FALSE)        # vettore logico
length(espr)                  # 3
mean(espr)                    # 3.6` },
        { t: "info", title: "Gli indici partono da 1", text: "In R il **primo** elemento ha indice **1** (in Python e in C++ è 0). Si legge con le parentesi quadre: `x[1]`.\n\nPuoi anche prendere più elementi insieme: `x[c(1, 3)]` prende il primo e il terzo; `x[-1]` prende tutti **tranne** il primo; `x[x > 2]` prende quelli che rispettano una condizione.", code: `x <- c(10, 20, 30)
x[1]          # 10
x[c(1, 3)]    # 10 30
x[-1]         # 20 30
x[x > 15]     # 20 30`, cpp: "Attenzione: indici da 1, non da 0. `x[0]` in R non dà errore ma restituisce un vettore vuoto." },
        { t: "mc", q: "Cosa restituisce?", code: `x <- c(10, 20, 30)
x[1]`, opts: ["10", "20", "Errore"], mono: 1, a: 0, why: "In R il primo elemento ha indice 1." },
        { t: "fill", q: "Crea un vettore di geni.", code: `geni ___ c("TP53", "MYC")`, bank: ["<-", "=>", "::"], ans: ["<-"], why: "<- è l’operatore di assegnazione tipico di R." },
        { t: "mc", q: "Cosa restituisce?", code: `length(c(1, 2, 3, 4))`, opts: ["3", "4", "5"], mono: 1, a: 1, why: "Il vettore ha quattro elementi." },
        { t: "info", title: "Operazioni vettorizzate", text: "In R le operazioni si applicano **a ogni elemento** del vettore, senza scrivere cicli: si dice che sono *vettorizzate*. `c(1, 2, 3) * 2` dà `2 4 6`.\n\n`a:b` crea la sequenza di interi da `a` a `b`: `1:5` è `1 2 3 4 5`. Funzioni come `sum`, `mean`, `max` lavorano sull’intero vettore.", code: `c(1, 2, 3) * 2        # 2 4 6
c(1, 2, 3) + c(10, 20, 30)   # 11 22 33
x <- 1:5
sum(x)                # 15
x > 2                 # FALSE FALSE TRUE TRUE TRUE`, note: "`NA` indica un valore mancante. Molte funzioni restituiscono `NA` se ce n’è uno, a meno di aggiungere `na.rm = TRUE`: `mean(x, na.rm = TRUE)`." },
        { t: "mc", q: "Cosa restituisce?", code: `c(1, 2, 3) * 2`, opts: ["2 4 6", "1 2 3 1 2 3", "Errore"], mono: 1, a: 0, why: "Le operazioni in R sono vettorizzate: si applicano a ogni elemento." },
        { t: "type", q: "Scrivi cosa restituisce.", code: `x <- 1:5
sum(x)`, ans: ["15"], why: "1:5 crea 1, 2, 3, 4, 5." }
    ]},
    { id: "r2", title: "Data frame", sub: "Tabelle di dati", ex: [
        { t: "info", title: "Il data frame: una tabella", text: "Un **data frame** è una tabella: ogni **colonna** è un vettore (tutti della stessa lunghezza), ogni **riga** è un’osservazione, per esempio un gene. È la struttura che userai di più.", points: ["`df$colonna` prende una colonna (come vettore).", "`nrow(df)` righe, `ncol(df)` colonne, `dim(df)` entrambe.", "`head(df)` mostra le prime **6** righe; `str(df)` la struttura; `summary(df)` statistiche veloci."], code: `df <- data.frame(gene = c("TP53", "MYC", "EGFR"),
                 fc   = c(2.5, -1.2, 0.4))
df$fc        # 2.5 -1.2 0.4
nrow(df)     # 3
head(df)` },
        { t: "info", title: "Selezionare righe e colonne", text: "Con le parentesi quadre si scrive `df[righe, colonne]`. Se lasci vuota una delle due parti, prendi **tutto**.\n\nPer filtrare le righe metti una **condizione** al posto delle righe: R tiene quelle dove la condizione è `TRUE`. Non dimenticare la virgola, che indica “tutte le colonne”.", code: `df[1, ]                 # prima riga, tutte le colonne
df[, "gene"]            # colonna gene
df[df$fc > 1, ]         # righe con fc > 1
df[df$fc > 1, "gene"]   # solo i nomi` },
        { t: "mc", q: "Come selezioni i geni con fc > 1?", opts: ["df[df$fc > 1, ]", "df[fc > 1]", "filter(df > 1)"], mono: 1, a: 0, why: "[righe, colonne]: la condizione sceglie le righe, lo spazio vuoto tiene tutte le colonne." },
        { t: "fill", q: "Conta le righe.", code: `___(df)`, bank: ["nrow", "len", "rows"], ans: ["nrow"], why: "nrow() conta le righe, ncol() le colonne." },
        { t: "mc", q: "Quante righe mostra head(df) in R?", opts: ["6", "5", "10"], a: 0, why: "In R head() mostra 6 righe (in pandas 5)." },
        { t: "info", title: "Leggere i file", text: "I dati di solito arrivano da file di testo:", points: ["`read.csv(\"file.csv\")` per valori separati da virgole;", "`read.delim(\"file.tsv\")` per valori separati da tab (TSV);", "`write.csv(df, \"out.csv\", row.names = FALSE)` per salvare."], note: "R cerca i file nella **cartella di lavoro**: `getwd()` ti dice qual è, `setwd(\"percorso\")` la cambia. In RStudio conviene lavorare dentro un *Project*." },
        { t: "mc", q: "Come leggi un file TSV?", opts: ["read.delim(\"file.tsv\")", "open(\"file.tsv\")", "load.tsv(\"file.tsv\")"], mono: 1, a: 0, why: "read.delim usa il tab come separatore di default." }
    ]},
    { id: "r4", title: "Funzioni e apply", sub: "function, sapply, %in%", ex: [
        { t: "info", title: "Scrivere funzioni", text: "In R una funzione si crea con `function(parametri) { corpo }` e si assegna a un nome come qualsiasi valore.\n\nLa funzione restituisce **l’ultima espressione valutata**: `return()` esiste, ma non è obbligatorio.", code: `quadrato <- function(x) {
  x^2
}
quadrato(3)        # 9
quadrato(1:3)      # 1 4 9 (vettorizzata!)` },
        { t: "mc", q: "Cosa restituisce una funzione R senza return()?", opts: ["L’ultima espressione valutata", "NULL", "Errore"], a: 0, why: "return() esplicito è opzionale in R." },
        { t: "fill", q: "Definisci una funzione.", code: `quadrato <- ___(x) x^2`, bank: ["function", "def", "fn"], ans: ["function"], why: "In R le funzioni si creano con function." },
        { t: "info", title: "Applicare una funzione a ogni elemento", text: "Quando un’operazione non è già vettorizzata, `sapply(vettore, funzione)` la applica a ogni elemento e raccoglie i risultati in un vettore. La funzione può essere scritta direttamente lì, senza nome (funzione *anonima*).", code: `sapply(1:3, function(x) x * 10)     # 10 20 30
sapply(c("TP53", "MYC"), nchar)    # TP53 4, MYC 3` },
        { t: "mc", q: "Cosa restituisce?", code: `sapply(1:3, function(x) x * 10)`, opts: ["10 20 30", "1 2 3", "30"], mono: 1, a: 0, why: "La funzione viene applicata a 1, 2 e 3." },
        { t: "info", title: "%in% e strsplit", text: "`a %in% b` dice, per ogni elemento di `a`, se è presente in `b`: restituisce `TRUE`/`FALSE`.\n\n`strsplit(testo, \"\")` divide una stringa in caratteri. Restituisce una **lista** (un contenitore che può avere elementi di qualsiasi tipo); con `[[1]]` prendi il primo elemento, cioè il vettore di caratteri.", code: `"G" %in% c("A", "G")                   # TRUE
basi <- strsplit("GGAT", "")[[1]]      # "G" "G" "A" "T"
mean(basi %in% c("G", "C"))            # 0.5: frazione GC
gc <- function(seq) mean(strsplit(seq, "")[[1]] %in% c("G", "C"))
sapply(c("GGCC", "ATAT"), gc)          # 1 0`, note: "`mean` di un vettore logico dà la frazione di `TRUE`, perché `TRUE` vale 1 e `FALSE` vale 0." },
        { t: "mc", q: "Cosa restituisce?", code: `"G" %in% c("A", "G")`, opts: ["TRUE", "FALSE", "2"], mono: 1, a: 0, why: "%in% verifica l’appartenenza." }
    ]}
  ]},
  { title: "Analisi dei dati", lessons: [
    { id: "r5", title: "dplyr", sub: "filter, select, mutate", ex: [
        { t: "info", title: "Pacchetti: installare e caricare", text: "Le funzioni di base di R si possono estendere con i **pacchetti**. Due passaggi diversi:", points: ["`install.packages(\"dplyr\")` **una volta sola**: scarica e installa il pacchetto;", "`library(dplyr)` **in ogni sessione o script**: lo carica, rendendo disponibili le sue funzioni."], note: "Se R dice “could not find function”, quasi sempre hai dimenticato `library(...)`." },
        { t: "info", title: "dplyr: i verbi per le tabelle", text: "**dplyr** (parte del *tidyverse*) offre funzioni chiare, i “verbi”, per manipolare data frame:", points: ["`filter(df, condizione)`: tiene le **righe** che rispettano la condizione;", "`select(df, col1, col2)`: tiene le **colonne** indicate;", "`mutate(df, nuova = …)`: crea o modifica una colonna;", "`arrange(df, col)` ordina (`desc(col)` in ordine decrescente);", "`group_by(df, col)` + `summarise(...)`: calcoli per gruppo, per esempio `n()` conta le righe."] },
        { t: "mc", q: "Cosa fa filter()?", opts: ["Tiene le righe che soddisfano una condizione", "Tiene alcune colonne", "Ordina"], a: 0, why: "Per le colonne si usa select()." },
        { t: "fill", q: "Tieni solo due colonne.", code: `df |> ___(gene, log2FC)`, bank: ["select", "filter", "pick"], ans: ["select"], why: "select sceglie le colonne." },
        { t: "info", title: "La pipe |>", text: "La **pipe** `|>` passa il risultato a sinistra come **primo argomento** della funzione a destra: `x |> f(y)` equivale a `f(x, y)`.\n\nCosì una serie di passaggi si legge dall’alto in basso, come una ricetta, invece che dall’interno verso l’esterno. Nei vecchi script vedrai `%>%`, che fa quasi la stessa cosa.", code: `library(dplyr)
ris <- data.frame(gene = c("a", "b", "c"), padj = c(0.01, 0.2, 0.001),
                  log2FC = c(2, -3, 0.5), cromosoma = c("1", "1", "2"))
ris |>
  filter(padj < 0.05) |>
  mutate(direzione = ifelse(log2FC > 0, "su", "giù")) |>
  arrange(padj)

ris |> group_by(cromosoma) |> summarise(n = n())` },
        { t: "mc", q: "Cosa fa la pipe |>?", opts: ["Passa il risultato a sinistra come primo argomento della funzione a destra", "Collega un file a un comando", "Esegue in parallelo"], a: 0, why: "x |> f(y) equivale a f(x, y)." },
        { t: "mc", q: "Cosa fa group_by(cromosoma) |> summarise(n = n())?", opts: ["Conta i geni per cromosoma", "Somma i cromosomi", "Elimina i cromosomi"], a: 0, why: "Raggruppa e calcola un riassunto per gruppo." },
        { t: "order", q: "Prendi i 10 geni significativi più sovraespressi.", lines: ["df |>", "  filter(padj < 0.05) |>", "  arrange(desc(log2FC)) |>", "  head(10)"], why: "Prima filtra, poi ordina, infine prendi i primi." }
    ]},
    { id: "r6", title: "ggplot2", sub: "Grafici", ex: [
        { t: "info", title: "La grammatica dei grafici", text: "**ggplot2** costruisce i grafici a strati, sommandoli con `+`:", points: ["`ggplot(dati, aes(...))`: i dati e le **mappature estetiche** (`aes`), cioè quale colonna va sull’asse x, quale sull’asse y, quale decide il colore…;", "`geom_…()`: la **forma** dei dati: `geom_point()` punti, `geom_histogram()` istogramma, `geom_boxplot()` boxplot, `geom_line()` linee;", "altri strati opzionali: titoli (`labs`), temi (`theme_minimal()`)…"], code: `library(ggplot2)
df <- data.frame(lunghezza = c(120, 340, 560, 220, 410))
ggplot(df, aes(x = lunghezza)) +
  geom_histogram(bins = 5)` },
        { t: "mc", q: "A cosa serve aes()?", opts: ["Mappa colonne su assi, colori e dimensioni", "Salva il grafico", "Carica i dati"], a: 0, why: "aes = aesthetic mappings." },
        { t: "fill", q: "Disegna un istogramma.", code: `ggplot(df, aes(x = lunghezza)) +
  ___()`, bank: ["geom_histogram", "geom_point", "plot_hist"], ans: ["geom_histogram"], why: "Ogni tipo di grafico è un geom_*." },
        { t: "info", title: "Il volcano plot", text: "Un grafico tipico dell’espressione differenziale. Ogni punto è un gene:", points: ["asse x: `log2FC`, quanto cambia l’espressione (positivo = aumenta);", "asse y: `-log10(padj)`, quanto è significativo. Il p-value piccolo diventa un valore grande, quindi i geni significativi stanno **in alto**."], code: `ris <- data.frame(log2FC = c(2, -3, 0.5, 0.1), padj = c(0.001, 0.0001, 0.3, 0.9))
ggplot(ris, aes(x = log2FC, y = -log10(padj))) +
  geom_point()` },
        { t: "mc", q: "Cosa mostra un volcano plot?", opts: ["log2FC contro -log10(p-value)", "GC contro lunghezza", "Coverage lungo il genoma"], a: 0, why: "In alto ai lati ci sono i geni con grande effetto e significativi." },
        { t: "info", title: "Salvare il grafico", text: "`ggsave(\"figura.png\")` salva l’ultimo grafico creato; il formato si sceglie dall’estensione (`.png`, `.pdf`, `.svg`). Puoi indicare le dimensioni: `ggsave(\"fig.pdf\", width = 6, height = 4)` (in pollici)." },
        { t: "mc", q: "Come salvi l’ultimo grafico?", opts: ["ggsave(\"fig.png\")", "save.plot()", "export()"], mono: 1, a: 0, why: "ggsave sceglie il formato dall’estensione." }
    ]}
  ]},
  { title: "Genomica", lessons: [
    { id: "r3", title: "Bioconductor", sub: "Biostrings e DESeq2", ex: [
        { t: "info", title: "Bioconductor", text: "**Bioconductor** è una raccolta di migliaia di pacchetti R per la biologia: sequenze (`Biostrings`), genomica, espressione genica (`DESeq2`, `edgeR`)…\n\nSi installano con il pacchetto `BiocManager`, non con `install.packages`:", code: `# una volta sola:
# install.packages("BiocManager")
# BiocManager::install("Biostrings")

library(Biostrings)
s <- DNAString("ATGCGT")
reverseComplement(s)    # ACGCAT`, note: "`pacchetto::funzione` chiama una funzione di un pacchetto senza caricarlo con `library`: `BiocManager::install(...)`." },
        { t: "info", title: "Espressione differenziale in breve", text: "Con l’**RNA-seq** si conta quante *read* (frammenti sequenziati) cadono su ogni gene, in campioni di condizioni diverse (es. controllo vs trattato). **DESeq2** stima per ogni gene:", points: ["il **log2 fold change** (`log2FC`): di quanto cambia l’espressione, in scala logaritmica in base 2. `1` = raddoppia, `-1` = si dimezza, `0` = nessun cambiamento;", "un **p-value aggiustato** (`padj`): quanto è credibile che il cambiamento non sia dovuto al caso."] },
        { t: "mc", q: "A cosa serve DESeq2?", opts: ["Espressione differenziale da RNA-seq", "Allineare le read", "Disegnare alberi filogenetici"], a: 0, why: "DESeq2 stima quali geni cambiano espressione tra condizioni." },
        { t: "fill", q: "Carica il pacchetto.", code: `___(DESeq2)`, bank: ["library", "import", "require_all"], ans: ["library"], why: "library() carica un pacchetto installato." },
        { t: "mc", q: "Un log2 fold change pari a 1 significa…", opts: ["Espressione raddoppiata", "Aumento dell’1%", "Nessun cambiamento"], a: 0, why: "2^1 = 2: il gene è espresso il doppio. log2FC = 0 indica nessun cambiamento." },
        { t: "mc", q: "Come installi un pacchetto Bioconductor?", opts: ["BiocManager::install(\"DESeq2\")", "pip install DESeq2", "library.install(\"DESeq2\")"], mono: 1, a: 0, why: "I pacchetti Bioconductor si installano con BiocManager." }
    ]},
    { id: "r7", title: "Statistica", sub: "t-test e test multipli", ex: [
        { t: "info", title: "Cos’è un p-value", text: "Un test statistico parte da un’**ipotesi nulla**, per esempio “le due medie sono uguali”. Il **p-value** è la probabilità di osservare dati così diversi (o di più) **se l’ipotesi nulla fosse vera**. Se è piccolo (di solito sotto `0.05`), si considera il risultato “significativo”.\n\n`t.test(a, b)` confronta le medie di due gruppi e restituisce, tra le altre cose, il p-value.", code: `ctrl  <- c(5.1, 4.8, 5.3)
tratt <- c(7.2, 6.9, 7.5)
t.test(ctrl, tratt)$p.value` },
        { t: "info", title: "Il problema dei test multipli", text: "Con una soglia di `0.05`, in media un test su 20 dà un falso positivo **per puro caso**. Se testi 20.000 geni, anche se nessuno cambia davvero ti aspetti circa 20.000 × 0.05 = **1.000** falsi positivi.\n\nPer questo i p-value vanno **corretti**. Il metodo più usato in genomica è **Benjamini–Hochberg** (`\"BH\"`), che controlla il **False Discovery Rate**: la frazione attesa di falsi positivi tra i risultati che dichiari significativi.", code: `p <- c(0.01, 0.02, 0.03, 0.04, 0.5)
p.adjust(p, method = "BH")   # 0.05 0.05 0.05 0.05 0.50` },
        { t: "mc", q: "Perché correggere i p-value quando testi migliaia di geni?", opts: ["Per limitare i falsi positivi dovuti ai test multipli", "Per renderli più piccoli", "Non serve"], a: 0, why: "Più test fai, più falsi positivi ottieni per caso." },
        { t: "mc", q: "20.000 geni, nessuno cambia davvero, soglia 0.05 senza correzione: quanti falsi positivi ti aspetti?", opts: ["Circa 1.000", "Circa 5", "0"], a: 0, why: "20.000 × 0.05 = 1.000." },
        { t: "fill", q: "Correggi con Benjamini-Hochberg.", code: `p.adjust(p, method = ___)`, bank: ["\"BH\"", "\"mean\"", "\"t\""], ans: ["\"BH\""], why: "BH è il metodo più usato in genomica." },
        { t: "mc", q: "Cosa controlla il metodo BH?", opts: ["Il False Discovery Rate", "La varianza", "La media"], a: 0, why: "FDR = frazione attesa di falsi positivi tra i risultati significativi." }
    ]},
    { id: "r8s", kind: "sfida", title: "Missione · R sul tuo computer", sub: "Filtrare e riassumere risultati veri", ex: [
        { t: "info", title: "Come funziona una missione", text: "Le missioni si svolgono **sul tuo computer**, perché R non può girare dentro l’app. Segui le istruzioni, esegui i comandi e **incolla il risultato** nel riquadro: l’app controlla se è corretto.\n\nCome nelle sfide hai a disposizione suggerimenti e, dopo un paio di tentativi, la soluzione." },
        { t: "info", title: "Preparare R", text: "Ti servono due programmi gratuiti: **R**, da cran.r-project.org, e **RStudio Desktop**, da posit.co. Installa prima R, poi RStudio.\n\nSe preferisci non installare nulla, puoi usare **Posit Cloud** (posit.cloud), che fa girare RStudio nel browser.\n\nIn RStudio scrivi i comandi nella **Console**, in basso a sinistra, e premi Invio." },
        {
          t: "task",
          q: "Quanti geni sono significativi?",
          text: "Copia questi comandi nella console di R: creano una piccola tabella di risultati di espressione differenziale.\n\nPoi scrivi **tu** il filtro: quanti geni hanno `padj < 0.05` **e** un valore assoluto di `log2FC` maggiore di 1?",
          points: ["Il valore assoluto in R si calcola con `abs()`.", "`nrow()` conta le righe di un data frame.", "Scrivi nel riquadro solo il numero."],
          code: `ris <- data.frame(
  gene   = c("TP53", "MYC", "EGFR", "BRCA1", "KRAS", "PTEN"),
  log2FC = c(2.1, -1.4, 0.3, 1.8, -0.6, -2.5),
  padj   = c(0.001, 0.03, 0.6, 0.2, 0.01, 0.004)
)`,
          ans: ["3", "[1] 3"],
          hints: ["Per filtrare le righe: `ris[condizione, ]`. Le condizioni si combinano con `&`.", "La condizione completa è `ris$padj < 0.05 & abs(ris$log2FC) > 1`.", "`nrow(ris[ris$padj < 0.05 & abs(ris$log2FC) > 1, ])`"],
          solution: `sig <- ris[ris$padj < 0.05 & abs(ris$log2FC) > 1, ]
nrow(sig)          # [1] 3   (TP53, MYC, PTEN)`,
          why: "BRCA1 ha un log2FC alto ma `padj` 0.2, KRAS è significativo ma cambia poco (|−0.6| < 1), EGFR né l’uno né l’altro."
        },
        {
          t: "task",
          q: "La media dei significativi",
          text: "Usando la stessa tabella, calcola la **media del log2FC** dei geni significativi del passo precedente, arrotondata a **2 decimali**.",
          points: ["`mean()` calcola la media, `round(x, 2)` arrotonda.", "Scrivi nel riquadro il numero che stampa R."],
          ans: ["-0.6", "-0.60", "[1] -0.6"],
          hints: ["Prendi prima il data frame filtrato `sig` del passo precedente.", "La colonna dei log2FC è `sig$log2FC`.", "`round(mean(sig$log2FC), 2)`"],
          solution: `sig <- ris[ris$padj < 0.05 & abs(ris$log2FC) > 1, ]
round(mean(sig$log2FC), 2)   # [1] -0.6`,
          why: "(2.1 − 1.4 − 2.5) / 3 = −1.8 / 3 = −0.6. Due geni su tre sono sottoespressi, quindi la media è negativa."
        }
    ]}
  ]}
  ]
});

/* Corso: sh — vedi README per il formato degli esercizi */
ELICA.addCourse({
  id: "sh",
  order: 50,
  name: "Bash",
  lang: "bash",
  tag: "Il terminale: dove vivono FASTQ, BAM, VCF e le pipeline.",
  units: [
  { title: "Terminale", lessons: [
    { id: "s1", title: "Muoversi nel sistema", sub: "pwd, ls, cd", ex: [
        { t: "info", title: "Il terminale", text: "Il **terminale** è un programma in cui dai ordini al computer **scrivendo comandi** invece di cliccare. Il programma che interpreta i comandi si chiama **shell**; la più diffusa è **Bash**.\n\nIn bioinformatica si usa moltissimo: quasi tutti gli strumenti (allineatori, BLAST, samtools…) sono comandi da terminale, e lavorano su file troppo grandi per aprirli con un editor.", points: ["**Mac** e **Linux**: apri l’app “Terminale”.", "**Windows**: installa **WSL** (un Linux dentro Windows) oppure **Git Bash**.", "A sinistra del cursore vedi il **prompt** (spesso termina con `$`): significa “aspetto un comando”. Nei nostri esempi il `$` non va scritto."] },
        { t: "info", title: "Com’è fatto un comando", text: "Un comando è formato da: **nome**, eventuali **opzioni** (iniziano con `-` o `--`) e **argomenti** (su cosa agire), separati da spazi. Premi Invio per eseguirlo.", code: `ls                 # nome da solo: elenca i file
ls -l              # con un'opzione: elenco dettagliato
ls -l dati/        # con opzione e argomento
wc --help          # quasi ogni comando ha un aiuto`, note: "Usa il tasto **Tab** per completare automaticamente nomi di file e comandi, e le **frecce su/giù** per richiamare i comandi precedenti. Ti risparmiano un sacco di errori di battitura." },
        { t: "info", title: "Cartelle e percorsi", text: "I file sono organizzati in cartelle (*directory*) una dentro l’altra. In ogni momento il terminale “si trova” in una cartella, la **cartella di lavoro**.", points: ["`pwd` (*print working directory*): mostra dove sei.", "`ls`: elenca il contenuto della cartella.", "`cd nome`: entra nella cartella `nome`.", "`..` è la cartella **superiore**, `.` è quella **attuale**, `~` è la tua cartella **home**.", "`cd` da solo ti riporta nella home.", "Un percorso che inizia con `/` è **assoluto** (parte dalla radice del disco); altrimenti è **relativo** alla cartella in cui sei."], code: `pwd              # /home/raffaele
cd progetto/dati
cd ..            # torna su di un livello
cd               # torna alla home` },
        { t: "mc", q: "Quale comando mostra la cartella corrente?", opts: ["pwd", "ls", "cd"], mono: 1, a: 0, why: "pwd = print working directory." },
        { t: "fill", q: "Torna alla cartella superiore.", code: `cd ___`, bank: ["..", ".", "~/"], ans: [".."], why: ".. è la cartella genitore, . quella attuale." },
        { t: "info", title: "Il jolly *", text: "Nei nomi di file, `*` significa “qualsiasi sequenza di caratteri”. `*.fa` indica tutti i file che finiscono in `.fa`. È la shell a sostituire `*.fa` con l’elenco dei file corrispondenti, prima di eseguire il comando.", code: `ls *.fa            # tutti i FASTA della cartella
ls gene*           # tutti i file che iniziano con "gene"` },
        { t: "mc", q: "Cosa mostra ls *.fa?", opts: ["Tutti i file che finiscono in .fa", "Il file chiamato *.fa", "Le cartelle nascoste"], a: 0, why: "* è un jolly che corrisponde a qualsiasi testo." },
        { t: "mc", q: "Dove ti porta cd senza argomenti?", opts: ["Nella tua cartella home", "Nella cartella radice /", "Da nessuna parte"], a: 0, why: "cd da solo equivale a cd ~." }
    ]},
    { id: "s4", title: "File e cartelle", sub: "mkdir, cp, mv, rm", ex: [
        { t: "info", title: "Creare, copiare, spostare", text: "I comandi base per organizzare i file:", points: ["`mkdir nome`: crea una cartella.", "`cp origine destinazione`: copia un file (`cp -r` per copiare una cartella con tutto il contenuto).", "`mv origine destinazione`: **sposta**; se la destinazione è un nuovo nome nella stessa cartella, **rinomina**.", "`cat file`: stampa il contenuto di un file; `less file`: lo mostra pagina per pagina (frecce per scorrere, `q` per uscire)."], code: `mkdir progetto
cp dati.fa progetto/
mv progetto/dati.fa progetto/geni.fa    # rinomina
less progetto/geni.fa` },
        { t: "mc", q: "A cosa serve mv?", opts: ["Spostare o rinominare", "Copiare", "Cancellare"], a: 0, why: "Rinominare è uno spostamento con un nome nuovo." },
        { t: "info", title: "Cancellare (con attenzione)", text: "`rm file` cancella un file; `rm -r cartella` cancella una cartella **con tutto il contenuto** (`-r` = ricorsivo).\n\nNel terminale **non esiste il cestino**: quello che cancelli con `rm` è perso.", note: "Prima di un `rm` con il jolly (`rm *.tmp`), lancia lo stesso comando con `ls` (`ls *.tmp`) per vedere cosa verrà cancellato." },
        { t: "fill", q: "Cancella una cartella con tutto il contenuto.", code: `___ -r vecchia_cartella`, bank: ["rm", "del", "erase"], ans: ["rm"], why: "-r = ricorsivo." },
        { t: "mc", q: "Cosa fa rm nel terminale?", opts: ["Cancella definitivamente, senza cestino", "Sposta nel cestino", "Chiede sempre conferma"], a: 0, why: "Non c’è annulla: attenzione con rm -r." },
        { t: "info", title: "Mandare l’output in un file", text: "Normalmente un comando scrive il risultato sullo schermo. Con `>` lo mandi in un file, che viene **creato o sovrascritto**; con `>>` lo **aggiungi** in fondo a un file esistente.\n\n`cat` con più file li stampa uno dopo l’altro: con `>` ottieni un unico file che li unisce.", code: `cat a.fa b.fa > tutti.fa       # unisce i due FASTA
echo "fine" >> log.txt          # aggiunge una riga` },
        { t: "mc", q: "Cosa fa cat a.fa b.fa > tutti.fa?", opts: ["Unisce i due file in tutti.fa", "Confronta i file", "Conta le righe"], mono: 0, a: 0, why: "cat concatena, > scrive l’output nel file." }
    ]}
  ]},
  { title: "Dati genomici", lessons: [
    { id: "s2", title: "FASTA e FASTQ", sub: "grep, head, wc", ex: [
        { t: "info", title: "Guardare dentro un file", text: "I file di sequenze possono essere enormi. Invece di aprirli, se ne guarda un pezzo:", points: ["`head file` mostra le prime 10 righe; `head -n 4 file` le prime 4.", "`tail file` mostra le ultime righe.", "`wc -l file` conta le righe (*word count*, `-l` = *lines*)."], code: `head -n 4 reads.fastq
wc -l reads.fastq` },
        { t: "info", title: "Cercare con grep", text: "`grep testo file` stampa le righe che contengono `testo`. Opzioni utili: `-c` **conta** le righe trovate invece di stamparle; `-v` stampa le righe che **non** lo contengono.\n\nIn un FASTA ogni sequenza ha una riga che inizia con `>`: contarle con `grep -c` dice quante sequenze ci sono. Metti `\">\"` tra virgolette, perché da solo `>` significherebbe “manda l’output in un file”.", code: `grep -c ">" geni.fa      # numero di sequenze
grep "BRCA1" geni.fa     # trova l'header di BRCA1` },
        { t: "mc", q: "Come conti le sequenze in un FASTA?", opts: ["grep -c \">\" file.fa", "wc -c file.fa", "ls file.fa"], mono: 1, a: 0, why: "Ogni sequenza ha un header \">\": basta contarli." },
        { t: "fill", q: "Mostra le prime 10 righe.", code: `___ -n 10 reads.fastq`, bank: ["head", "tail", "top"], ans: ["head"], why: "head mostra l’inizio, tail la fine." },
        { t: "info", title: "Il formato FASTQ", text: "I sequenziatori producono file **FASTQ**: ogni *read* (frammento letto) occupa **4 righe**:", points: ["1. `@` + identificativo della read", "2. la sequenza", "3. `+` (riga separatrice)", "4. la **qualità** di ogni base, codificata con un carattere"], code: `@read1
ACGTTGCA
+
IIIIHHGG` },
        { t: "mc", q: "Quante righe occupa un record FASTQ?", opts: ["4", "2", "1"], mono: 1, a: 0, why: "Header @, sequenza, separatore +, qualità. È lo standard dei sequenziatori moderni (FASTQ molto vecchi potevano andare a capo, oggi è rarissimo)." },
        { t: "info", title: "Fare calcoli in Bash", text: "`$(comando)` esegue un comando e mette il suo **risultato** al suo posto (si chiama *command substitution*). `$(( … ))` calcola un’espressione aritmetica con numeri interi.\n\n`wc -l < file` legge il file senza stamparne il nome, così ottieni solo il numero. Diviso per 4 righe per read, dà il numero di read.", code: `echo $(( 10 / 4 ))                      # 2 (divisione intera)
echo $(( $(wc -l < reads.fastq) / 4 ))   # numero di read` },
        { t: "fill", q: "Calcola il numero di read.", code: `echo $(( $(wc -l < r.fastq) / ___ ))`, bank: ["4", "2", "1"], ans: ["4"], why: "Righe totali diviso 4 righe per record." }
    ]},
    { id: "s3", title: "Pipe", sub: "Comandi in catena", ex: [
        { t: "info", title: "La pipe |", text: "La **pipe** `|` collega due comandi: l’output del primo diventa l’input del secondo. Così si costruiscono catene di piccoli comandi, ognuno con un compito semplice.", code: `grep ">" geni.fa | wc -l      # come grep -c ">"
echo "ATGC" | wc -c           # conta i caratteri: 5`, note: "`echo` aggiunge un a capo alla fine, e anche quello è un carattere: per questo `wc -c` conta 5, non 4." },
        { t: "info", title: "cut, sort, uniq", text: "Tre comandi che si usano spesso insieme sui file a colonne (separati da tab):", points: ["`cut -f1 file` prende la colonna 1 (`-f2` la seconda, `-f1,3` la prima e la terza).", "`sort` ordina le righe.", "`uniq -c` unisce le righe **uguali e consecutive** e le conta."], code: `cut -f1 varianti.tsv | sort | uniq -c`, note: "`uniq` vede solo le righe uguali **adiacenti**: per contare correttamente, l’input va prima ordinato con `sort`." },
        { t: "mc", q: "uniq -c funziona correttamente solo se…", opts: ["L’input è ordinato", "Il file è FASTA", "Si usa sudo"], a: 0, why: "uniq unisce solo righe uguali adiacenti: per questo si mette sort prima." },
        { t: "info", title: "Un esempio: varianti per cromosoma", text: "Un file **VCF** elenca varianti genetiche: le righe che iniziano con `#` sono intestazioni, poi c’è una riga per variante con il cromosoma nella prima colonna.\n\n`grep -v \"^#\"` toglie le intestazioni (`^` = inizio riga); poi si prende la colonna 1, si ordina e si conta.", code: `grep -v "^#" varianti.vcf | cut -f1 | sort | uniq -c` },
        { t: "order", q: "Conta le varianti per cromosoma, saltando l’header del VCF.", lines: ["grep -v \"^#\" varianti.vcf", "| cut -f1", "| sort", "| uniq -c"], why: "Togli i commenti, prendi la colonna CHROM, ordina e conta." },
        { t: "mc", q: "Cosa fa > risultati.txt alla fine di un comando?", opts: ["Scrive l’output nel file", "Legge dal file", "Confronta l’output con il file"], a: 0, why: "> redirige l’output in un file, sovrascrivendolo; >> aggiunge in fondo." },
        { t: "type", q: "Scrivi cosa stampa.", code: `echo "ATGC" | wc -c`, ans: ["5"], why: "4 lettere più il carattere di a capo aggiunto da echo." }
    ]},
    { id: "s5", title: "awk e sed", sub: "Colonne e sostituzioni", ex: [
        { t: "info", title: "awk: lavorare per colonne", text: "**awk** legge un file riga per riga e divide ogni riga in **campi** (colonne). `$1` è il primo campo, `$2` il secondo, e così via; `$0` è la riga intera.\n\nUn programma awk si scrive tra apici singoli: `awk 'condizione {azione}'`. Se manca l’azione, stampa la riga; se manca la condizione, l’azione vale per tutte le righe.", code: `awk '{print $1, $2}' file.tsv     # prime due colonne
awk '$6 > 30' varianti.tsv         # righe con colonna 6 > 30
echo "chr1 100" | awk '{print $2}' # 100` },
        { t: "mc", q: "In awk, cosa indica $2?", opts: ["La seconda colonna", "Il secondo file", "La seconda riga"], mono: 0, a: 0, why: "$0 è l’intera riga." },
        { t: "info", title: "sed: trovare e sostituire", text: "**sed** modifica il testo riga per riga. Il comando più usato è la sostituzione: `s/vecchio/nuovo/`. Senza niente dopo l’ultima `/` sostituisce solo la **prima** occorrenza in ogni riga; con `g` (*global*) le sostituisce tutte.\n\nAnche `vecchio` può essere un pattern: `^chr` significa “chr all’inizio della riga”.", code: `echo "ATTG" | sed 's/T/U/'     # AUTG  (solo la prima)
echo "ATTG" | sed 's/T/U/g'    # AUUG  (tutte)
sed 's/^chr//' file.bed         # toglie "chr" a inizio riga` },
        { t: "fill", q: "Sostituisci T con U.", code: `sed '___/T/U/g' seq.txt`, bank: ["s", "r", "x"], ans: ["s"], why: "s = substitute." },
        { t: "mc", q: "Cosa fa la g finale in sed 's/T/U/g'?", opts: ["Sostituisce tutte le occorrenze nella riga", "Solo la prima", "Ignora maiuscole e minuscole"], a: 0, why: "Senza g si sostituisce solo la prima occorrenza per riga." },
        { t: "type", q: "Scrivi cosa stampa.", code: `echo "chr1 100" | awk '{print $2}'`, ans: ["100"], why: "Seconda colonna." },
        { t: "info", title: "Il separatore di awk", text: "Di default awk divide su spazi **e** tab. Se un valore contiene spazi (es. una descrizione), conviene dire esplicitamente che il separatore è il tab con `-F'\\t'`.", code: `awk -F'\\t' '{print $3}' tabella.tsv` },
        { t: "mc", q: "Cosa imposta awk -F'\\t'?", opts: ["Il separatore di colonna: tab", "Il file di output", "Un filtro"], a: 0, why: "-F sceglie il separatore di campo." }
    ]}
  ]},
  { title: "Automazione", lessons: [
    { id: "s6", title: "Cicli e script", sub: "for, variabili, chmod", ex: [
        { t: "info", title: "Variabili in Bash", text: "Una variabile si crea con `nome=valore`, **senza spazi** attorno all’uguale. Per leggerne il valore si mette `$` davanti: `$nome`.\n\nCon gli spazi (`x = 5`) Bash penserebbe che `x` sia un comando da eseguire con argomenti `=` e `5`, e darebbe errore.", code: `campione=paziente01
echo $campione              # paziente01
echo "file: \${campione}.fq"  # le graffe delimitano il nome`, note: "Metti le variabili tra virgolette doppie (`\"$f\"`) quando possono contenere spazi." },
        { t: "mc", q: "A cosa serve #!/bin/bash all’inizio?", opts: ["Indica quale interprete deve eseguire lo script", "È un commento qualsiasi", "Importa bash"], a: 0, why: "Si chiama shebang." },
        { t: "info", title: "Il ciclo for", text: "Il ciclo `for` ripete gli stessi comandi per ogni elemento di un elenco, spesso un elenco di file ottenuto con il jolly. La struttura è sempre `for … in …; do … done`.", code: `for f in *.fastq; do
    n=$(( $(wc -l < "$f") / 4 ))
    echo "$f: $n read"
done` },
        { t: "fill", q: "Completa il ciclo.", code: `for f in *.fa; ___
    echo $f
done`, bank: ["do", "then", "{"], ans: ["do"], why: "for … ; do … done." },
        { t: "info", title: "Script: salvare i comandi in un file", text: "Uno **script** è un file di testo con dei comandi, di solito con estensione `.sh`. La prima riga `#!/bin/bash` (si chiama *shebang*) dice al sistema quale programma deve eseguirlo.\n\nPer poterlo lanciare direttamente devi renderlo **eseguibile** una volta con `chmod +x`, poi lo avvii con `./nome.sh`, dove `./` significa “nella cartella attuale”.", code: `#!/bin/bash
# conta_reads.sh
for f in *.fastq; do
    echo "$f: $(( $(wc -l < "$f") / 4 ))"
done

# nel terminale:
# chmod +x conta_reads.sh
# ./conta_reads.sh` },
        { t: "mc", q: "Come rendi eseguibile uno script?", opts: ["chmod +x script.sh", "run script.sh", "exec +x script.sh"], mono: 1, a: 0, why: "Poi lo lanci con ./script.sh." },
        { t: "type", q: "Scrivi cosa stampa.", code: `x=5
echo $x`, ans: ["5"], why: "$x legge il valore della variabile." },
        { t: "mc", q: "Cosa succede con x = 5 (con gli spazi) in bash?", opts: ["Errore: in bash non vanno spazi attorno a =", "Assegna 5", "Stampa 5"], a: 0, why: "Bash interpreta x come un comando con argomenti = e 5." }
    ]},
    { id: "s7", title: "Strumenti NGS", sub: "zcat, bwa, samtools", ex: [
        { t: "info", title: "File compressi", text: "I file di sequenziamento sono grandi e quasi sempre **compressi** con gzip (estensione `.gz`). Non serve scompattarli per guardarli: `zcat` li decomprime al volo e manda il risultato sullo schermo o in una pipe.", code: `zcat reads.fastq.gz | head -n 8      # le prime 2 read
zcat reads.fastq.gz | wc -l           # righe totali` },
        { t: "info", title: "Allineare le read: SAM e BAM", text: "**Allineare** significa trovare da quale punto del genoma di riferimento proviene ogni read. Lo fanno programmi come **bwa** o **bowtie2**.\n\nIl risultato è un file **SAM**: una riga per allineamento, con la posizione nel genoma e altre informazioni. Il **BAM** è la stessa cosa in versione binaria compressa: molto più piccolo e veloce da leggere. Si gestiscono con **samtools**.", points: ["`bwa index ref.fa`: prepara l’indice del riferimento (**una volta sola**, prima di allineare).", "`bwa mem ref.fa reads.fq > aln.sam`: allinea.", "`samtools sort -o aln.bam aln.sam`: ordina per posizione e salva in BAM.", "`samtools index aln.bam`: crea l’indice per accedere velocemente a una regione (richiede un BAM **ordinato**)."] },
        { t: "mc", q: "Cos’è un file BAM?", opts: ["La versione binaria compressa di un SAM", "Un FASTA compresso", "Una tabella di varianti"], a: 0, why: "BAM = Binary Alignment Map." },
        { t: "fill", q: "Leggi un file compresso.", code: `___ reads.fastq.gz | head`, bank: ["zcat", "cat", "unzip"], ans: ["zcat"], why: "zcat decomprime al volo verso lo standard output." },
        { t: "mc", q: "Prima di indicizzare un BAM bisogna…", opts: ["Ordinarlo per coordinate", "Convertirlo in FASTA", "Comprimerlo con zip"], a: 0, why: "samtools index richiede un BAM ordinato." },
        { t: "mc", q: "Quale strumento allinea le read a un genoma?", opts: ["bwa / bowtie2", "samtools index", "grep"], mono: 0, a: 0, why: "Gli aligner mappano le read sul riferimento." },
        { t: "order", q: "Indicizza il riferimento, allinea, ordina e indicizza il BAM.", lines: ["bwa index ref.fa", "bwa mem ref.fa reads.fq > aln.sam", "samtools sort -o aln.bam aln.sam", "samtools index aln.bam"], why: "Senza bwa index, bwa mem si ferma con “fail to locate the index files”. Poi: allineamento → ordinamento → indice." },
        { t: "info", title: "Contare gli allineamenti", text: "`samtools view -c aln.bam` conta le **righe di allineamento**. Una read può averne più di una: allineamenti *secondari* (altre posizioni possibili) e *supplementari* (read spezzate in più punti).\n\nPer contare solo gli allineamenti **primari**, uno per read allineata, si escludono gli altri con il filtro `-F 0x900`.", code: `samtools view -c aln.bam            # tutte le righe
samtools view -c -F 0x900 aln.bam   # solo primari` },
        { t: "mc", q: "Cosa conta samtools view -c aln.bam?", opts: ["Le righe di allineamento, compresi secondari e supplementari", "Esattamente il numero di read sequenziate", "I cromosomi"], a: 0, why: "Una read può avere più righe. Per contare solo gli allineamenti primari: samtools view -c -F 0x900." }
    ]},
    { id: "s8s", kind: "sfida", title: "Missione · Il terminale sul tuo computer", sub: "File, grep e pipe dal vivo", ex: [
        { t: "info", title: "Come funziona una missione", text: "Le missioni si svolgono **sul tuo computer**, perché il terminale non può girare dentro l’app. Segui le istruzioni, esegui i comandi e **incolla il risultato** nel riquadro: l’app controlla se è corretto.\n\nCome nelle sfide hai a disposizione suggerimenti e, dopo un paio di tentativi, la soluzione." },
        { t: "info", title: "Aprire il terminale", text: "**Mac**: apri l’app Terminale (la trovi con Spotlight). **Linux**: apri il Terminale. **Windows**: installa **Git Bash** (con Git, da git-scm.com) oppure **WSL**, e apri quello.\n\nCrea una cartella per gli esercizi e spostati dentro:", code: `mkdir -p ~/elica-missioni
cd ~/elica-missioni`, note: "Copia solo i comandi: le righe che iniziano con `#`, che altrove indicano l’output atteso, non vanno eseguite. Sul Mac il terminale usa zsh, che per questi comandi funziona come Bash." },
        {
          t: "task",
          q: "Conta le sequenze",
          text: "Questo comando crea un file FASTA chiamato `prova.fa`. Eseguilo, poi usa **grep** per contare quante sequenze contiene.",
          points: ["Controlla il contenuto con `cat prova.fa`.", "Conta le righe di intestazione con l’opzione giusta di `grep`.", "Scrivi nel riquadro solo il numero."],
          code: `printf ">s1\\nATGC\\n>s2\\nGGCC\\n>s3\\nTTAA\\n" > prova.fa`,
          ans: ["3"],
          hints: ["Ogni sequenza ha una riga che inizia con `>`.", "`grep -c` conta le righe che contengono un testo.", "`grep -c \">\" prova.fa` (le virgolette attorno a `>` sono importanti)."],
          solution: `grep -c ">" prova.fa`,
          why: "Il comando stampa `3`: le righe che contengono `>` sono le tre intestazioni. Senza virgolette, `>` verrebbe interpretato come “manda l’output in un file”."
        },
        {
          t: "task",
          q: "Varianti per cromosoma",
          text: "Questo comando crea un piccolo file di varianti, `v.vcf`, separato da tab, con una riga di intestazione che inizia con `#`.\n\nScrivi una **pipe** che toglie l’intestazione, prende la prima colonna e conta le varianti per cromosoma. Incolla l’output completo.",
          points: ["`grep -v` tiene le righe che **non** contengono il testo; `^#` significa “# all’inizio della riga”.", "Ti servono anche `cut`, `sort` e `uniq -c`."],
          code: `printf "#CHROM\\tPOS\\nchr1\\t10\\nchr2\\t20\\nchr1\\t30\\nchr1\\t40\\n" > v.vcf`,
          ans: ["3 chr1\n1 chr2"],
          multiline: true,
          hints: ["Il primo pezzo è `grep -v \"^#\" v.vcf`.", "Poi `| cut -f1` per la prima colonna.", "Poi `| sort | uniq -c`: `uniq` conta solo le righe uguali consecutive, per questo serve `sort` prima."],
          solution: `grep -v "^#" v.vcf | cut -f1 | sort | uniq -c`,
          why: "L’output è `3 chr1` e `1 chr2`, su due righe (gli spazi prima dei numeri non contano). Ogni comando fa una cosa sola e la pipe li collega: filtra, taglia, ordina, conta."
        }
    ]}
  ]}

/* ---- content/60-git.js ---- */
/* Corso: Git e GitHub */
ELICA.addCourse({
  id: "git",
  order: 60,
  name: "Git",
  lang: "bash",
  tag: "Versionare il codice e pubblicarlo su GitHub: le basi per trasformare il tuo progetto in una repository.",
  units: [
  { title: "Le basi", lessons: [
    { id: "gt1", title: "Cos’è Git", sub: "repository, add, commit", ex: [
        { t: "info", title: "A cosa serve Git", text: "Quando lavori a un progetto, prima o poi ti capita di rompere qualcosa che funzionava, o di non ricordare cosa hai cambiato. **Git** è un programma che tiene la **storia completa** del progetto: puoi vedere ogni modifica, tornare indietro, provare idee senza paura.\n\n**Git** e **GitHub** non sono la stessa cosa: Git è il programma che usi sul tuo computer, GitHub è un sito che ospita online le repository Git per condividerle e farne una copia di sicurezza.", points: ["**Repository** (o *repo*): la cartella del progetto più la sua storia, salvata in una cartella nascosta `.git`.", "**Commit**: una “fotografia” del progetto in un certo momento, con un messaggio che descrive cosa è cambiato."] },
        { t: "info", title: "Il ciclo base: modifica, add, commit", text: "Il lavoro con Git ha tre momenti:", points: ["**modifichi** i file normalmente;", "con `git add` scegli **quali** modifiche includere nella prossima fotografia: le metti nella *staging area*, una zona di preparazione;", "con `git commit -m \"messaggio\"` **scatti** la fotografia."], code: `git init                      # una volta: trasforma la cartella in repository
git status                    # cosa è cambiato?
git add pipeline.py           # prepara questo file
git commit -m "Prima versione della pipeline"`, note: "La staging area serve a fare commit “puliti”: se hai cambiato tre file ma solo due riguardano la stessa modifica, aggiungi solo quei due." },
        { t: "mc", q: "Cosa fa git init?", opts: ["Crea una nuova repository nella cartella corrente", "Scarica un progetto da GitHub", "Salva le modifiche"], a: 0, why: "Crea la cartella nascosta .git dove vive tutta la storia." },
        { t: "mc", q: "Qual è l’ordine giusto?", opts: ["modifichi → git add → git commit", "git commit → git add → modifichi", "git add → modifichi → git commit"], a: 0, why: "Prima cambi, poi scegli cosa includere, poi registri." },
        { t: "fill", q: "Registra le modifiche con un messaggio.", code: `git ___ -m "Aggiunge il calcolo del GC"`, bank: ["commit", "save", "push"], ans: ["commit"], why: "push invia i commit online, ma prima bisogna crearli." },
        { t: "info", title: "git status", text: "`git status` è il comando da lanciare ogni volta che non sai a che punto sei. Ti mostra:", points: ["i file **modificati** ma non ancora aggiunti;", "i file **nella staging area**, pronti per il commit;", "i file **non tracciati** (*untracked*): nuovi file che Git non sta ancora seguendo."] },
        { t: "mc", q: "Cosa mostra git status?", opts: ["I file modificati, quelli nello staging e quelli non tracciati", "La storia dei commit", "Il contenuto dei file"], a: 0, why: "È il comando da lanciare quando non sai a che punto sei." },
        { t: "order", q: "Crea una repository e fai il primo commit.", lines: ["git init", "git add README.md", "git commit -m \"Primo commit\""], why: "init una volta sola, poi add e commit." },
        { t: "info", title: "Prima configurazione", text: "Ogni commit è firmato con un nome e un’email. Si impostano **una volta per computer**:", code: `git config --global user.name "Raffaele Ruggiero"
git config --global user.email "tua@email.it"`, note: "Se vuoi tenere privata la tua email su GitHub, nelle impostazioni (Settings → Emails) trovi un indirizzo “noreply” da usare qui." },
        { t: "mc", q: "Cosa va fatto una volta sola, prima del primo commit?", opts: ["git config --global user.name \"Nome\"", "git setup name \"Nome\"", "git user \"Nome\""], mono: 1, a: 0, why: "Nome ed email (user.email) firmano ogni commit." }
    ]},
    { id: "gt2", title: "Storia e differenze", sub: "log, diff, restore", ex: [
        { t: "info", title: "Vedere la storia", text: "`git log` mostra i commit, dal più recente; `git log --oneline` ne mostra uno per riga: un **ID** breve e il messaggio.\n\nL’ID (es. `a1b2c3d`) è l’inizio di un **hash**: un codice calcolato dal contenuto del commit, che lo identifica in modo univoco. Lo usi per riferirti a quel commit, per esempio `git show a1b2c3d`.", code: `git log --oneline
# 3f2a9c1 Aggiunge filtro per identità minima
# a1b2c3d Prima versione della pipeline` },
        { t: "mc", q: "Cosa mostra git log --oneline?", opts: ["Un commit per riga, con ID breve e messaggio", "Solo l’ultimo commit", "I file cambiati"], a: 0, why: "È il modo più rapido per vedere la storia." },
        { t: "info", title: "Vedere le differenze", text: "`git diff` mostra **riga per riga** cosa hai cambiato: le righe tolte iniziano con `-`, quelle aggiunte con `+`.", points: ["`git diff`: modifiche **non ancora** aggiunte con `git add`;", "`git diff --staged`: modifiche già aggiunte, cioè quello che entrerà nel prossimo commit."], note: "Dopo `git add`, `git diff` senza opzioni non mostra più quelle modifiche: non sono sparite, sono nella staging area." },
        { t: "mc", q: "Dopo git add, git diff senza opzioni mostra ancora quelle modifiche?", opts: ["No: per vederle serve git diff --staged", "Sì, sempre", "Solo dopo il commit"], a: 0, why: "git diff confronta i file con lo staging, non con l’ultimo commit." },
        { t: "info", title: "Annullare modifiche", text: "`git restore file` riporta un file com’era all’ultimo commit, buttando via le modifiche **non salvate** in un commit. È utile quando hai fatto un pasticcio e vuoi ripartire.\n\n`git restore --staged file` toglie un file dalla staging area senza perdere le modifiche.", note: "Le modifiche annullate con `git restore file` non si possono recuperare: usalo con attenzione." },
        { t: "fill", q: "Annulla le modifiche non salvate a un file.", code: `git ___ pipeline.py`, bank: ["restore", "undo", "revert-file"], ans: ["restore"], why: "Attenzione: le modifiche annullate non si recuperano." },
        { t: "info", title: "Buoni messaggi di commit", text: "Il messaggio deve far capire **cosa fa** il commit a chi leggerà la storia, compreso te tra sei mesi. Regole pratiche: frase breve, al presente, specifica.", points: ["Sì: `\"Aggiunge filtro per identità minima\"`, `\"Corregge il conteggio delle read\"`.", "No: `\"modifiche\"`, `\"fix\"`, `\"asdf\"`.", "Commit piccoli e frequenti: uno per ogni modifica che ha senso da sola."] },
        { t: "mc", q: "Quale messaggio di commit è migliore?", opts: ["\"Aggiunge filtro per identità minima\"", "\"modifiche\"", "\"asdf\""], a: 0, why: "Un buon messaggio dice cosa fa il commit, al presente." },
        { t: "mc", q: "Ogni commit ha un ID come a1b2c3d. Cos’è?", opts: ["Un hash che identifica quel commit in modo univoco", "Un numero progressivo", "La data"], a: 0, why: "Puoi usarlo per tornare a quel punto, per esempio con git show a1b2c3d." }
    ]},
    { id: "gt3", title: ".gitignore", sub: "Cosa NON versionare", ex: [
        { t: "info", title: "Cosa non mettere nella repository", text: "Nella repository va il **codice** e ciò che serve per usarlo, non tutto quello che c’è nella cartella. Restano fuori:", points: ["**dati grandi e rigenerabili** (genomi scaricati, risultati): si possono ricreare con il codice;", "**segreti**: password, token, chiavi API. Una volta finiti nella storia di Git è difficile toglierli davvero, e se la repo è pubblica chiunque può leggerli;", "file temporanei del sistema o dell’editor (`__pycache__/`, `.DS_Store`)."] },
        { t: "info", title: "Il file .gitignore", text: "`.gitignore` è un file di testo nella cartella principale del progetto. Ogni riga è un nome o un **pattern** di file da ignorare: Git non li mostrerà più tra i file non tracciati e `git add` non li aggiungerà.", points: ["`results/` ignora la cartella `results` (la `/` finale indica una cartella);", "`*.fna` ignora tutti i file che finiscono in `.fna` (`*` = qualsiasi testo);", "`#` inizia un commento."], code: `# .gitignore
data/
results/
*.fna
*.faa
*.zip
__pycache__/
.env` },
        { t: "mc", q: "Perché non versionare i genomi scaricati?", opts: ["Sono grandi e si possono riscaricare con lo script", "Git non legge i file FASTA", "Sono segreti"], a: 0, why: "Nella repository va il codice che li scarica, non i dati." },
        { t: "fill", q: "Ignora tutti i file .zip.", code: `___.zip`, bank: ["*", "%", "?"], ans: ["*"], why: "* corrisponde a qualsiasi nome." },
        { t: "mc", q: "Una password o una chiave API nel codice…", opts: ["Non va mai committata: usa variabili d’ambiente o un file .env ignorato", "Va bene se la repo è privata", "Va nel README"], a: 0, why: "Una volta nella storia di Git, è difficile toglierla davvero." },
        { t: "type", q: "Quale riga aggiungi al .gitignore per ignorare la cartella results?", ans: ["results/", "results", "/results/", "/results"], why: "La barra finale indica che è una cartella." },
        { t: "info", title: "File già tracciati", text: "`.gitignore` vale solo per i file **non ancora tracciati**. Se un file era già stato committato, Git continua a seguirlo anche dopo averlo aggiunto a `.gitignore`.\n\nPer smettere di tracciarlo senza cancellarlo dal disco: `git rm --cached file`, poi un commit.", code: `git rm --cached results/tabella.tsv
git commit -m "Smette di tracciare i risultati"` },
        { t: "mc", q: "Un file già committato, poi aggiunto al .gitignore…", opts: ["Resta tracciato finché non lo togli con git rm --cached", "Sparisce dalla storia", "Viene cancellato dal disco"], a: 0, why: ".gitignore vale solo per i file non ancora tracciati." }
    ]}
  ]},
  { title: "Branch", lessons: [
    { id: "gt4", title: "Branch e merge", sub: "Provare idee senza rompere nulla", ex: [
        { t: "info", title: "I branch", text: "Un **branch** (ramo) è una linea di sviluppo parallela. Il ramo principale di solito si chiama `main`.\n\nQuando vuoi provare una nuova funzione crei un branch, ci lavori e fai i tuoi commit lì: `main` resta intatto. Se l’idea funziona la unisci a `main` (*merge*), altrimenti cancelli il branch.", points: ["`git branch`: elenca i branch (l’asterisco indica quello attuale);", "`git switch -c nome`: crea un branch e ci passa;", "`git switch nome`: passa a un branch esistente;", "`git merge nome`: unisce il branch `nome` in quello in cui ti trovi;", "`git branch -d nome`: cancella un branch già unito."] },
        { t: "mc", q: "Cosa fa git switch -c nome?", opts: ["Crea un branch e ci passa", "Cancella un branch", "Unisce due branch"], a: 0, why: "Senza -c passa a un branch che esiste già." },
        { t: "info", title: "Un esempio completo", text: "Il merge si fa stando sul branch che **riceve** le modifiche, quindi prima si torna su `main`.", code: `git switch -c filtro-identita      # nuovo branch
# ...modifichi i file...
git add filtro.py
git commit -m "Aggiunge filtro per identità"
git switch main                    # torna su main
git merge filtro-identita          # porta dentro le modifiche
git branch -d filtro-identita      # pulizia` },
        { t: "order", q: "Sviluppa una funzione in un branch e uniscila.", lines: ["git switch -c nuova-analisi", "git add analisi.py", "git commit -m \"Aggiunge nuova analisi\"", "git switch main", "git merge nuova-analisi"], why: "Il merge si fa stando sul branch che riceve le modifiche." },
        { t: "info", title: "I conflitti", text: "Un **conflitto** succede quando due branch hanno modificato **le stesse righe** in modi diversi: Git non può sapere quale versione tenere e chiede a te. Nel file trovi dei marcatori:", code: `<<<<<<< HEAD
versione del branch in cui sei
=======
versione del branch che stai unendo
>>>>>>> filtro-identita`, note: "Per risolvere: modifica il file tenendo il codice giusto (una delle due versioni o un mix), **cancella i marcatori**, poi `git add file` e `git commit`. Non è un disastro: succede a tutti." },
        { t: "mc", q: "Quando avviene un conflitto di merge?", opts: ["Quando due branch modificano le stesse righe in modo diverso", "Quando fai troppi commit", "Quando il branch ha un nome lungo"], a: 0, why: "Git non sa quale versione tenere e chiede a te." },
        { t: "mc", q: "Nel file in conflitto vedi <<<<<<<, ======= e >>>>>>>. Cosa fai?", opts: ["Tieni o combini il codice giusto, togli i marcatori, poi git add e git commit", "Cancelli il file", "Rifai git init"], a: 0, why: "I marcatori delimitano le due versioni in conflitto." },
        { t: "fill", q: "Elenca i branch.", code: `git ___`, bank: ["branch", "list", "show"], ans: ["branch"], why: "L’asterisco indica il branch su cui sei." }
    ]}
  ]},
  { title: "GitHub", lessons: [
    { id: "gt5", title: "Remote, push e pull", sub: "Mettere il progetto online", ex: [
        { t: "info", title: "Remote: la copia online", text: "Un **remote** è una copia della repository su un server, per esempio GitHub. Il nome abituale del remote principale è `origin`.", points: ["`git remote add origin URL`: collega la repo locale a quella su GitHub (una volta);", "`git push`: **invia** i tuoi commit al remote;", "`git pull`: **scarica** i commit nuovi dal remote e li unisce ai tuoi;", "`git clone URL`: scarica una copia completa di una repository, con tutta la storia (si usa per iniziare a lavorare da un altro computer)."], code: `git remote add origin https://github.com/tuonome/genome-diff.git
git push -u origin main     # la prima volta
git push                    # le volte successive` },
        { t: "mc", q: "Cosa fa git push?", opts: ["Invia i tuoi commit al remote", "Scarica i commit", "Crea un commit"], a: 0, why: "git pull fa il contrario." },
        { t: "mc", q: "A cosa serve git clone?", opts: ["Scarica una copia completa di una repository, storia compresa", "Duplica un branch", "Copia un file"], a: 0, why: "È il modo per lavorare sul progetto da un altro computer." },
        { t: "fill", q: "Invia main a GitHub.", code: `git ___ origin main`, bank: ["push", "send", "upload"], ans: ["push"], why: "origin = dove, main = quale branch." },
        { t: "info", title: "Perché -u la prima volta", text: "`-u` (forma breve di `--set-upstream`) collega il tuo branch locale `main` a `origin/main`. Da quel momento basta scrivere `git push` e `git pull`, senza ripetere dove e quale branch." },
        { t: "mc", q: "Perché -u alla prima push?", opts: ["Collega il branch locale a quello remoto, così poi basta git push", "Rende la repo pubblica", "Cancella il remote"], a: 0, why: "-u sta per --set-upstream." },
        { t: "info", title: "Autenticarsi su GitHub", text: "Quando fai `push` su GitHub devi dimostrare chi sei. La **password dell’account non funziona** per i comandi Git: si usa un **token personale**, che inserisci quando ti chiede la password, oppure una **chiave SSH**.\n\nIn alternativa puoi usare **GitHub Desktop** o il comando `gh auth login`, che gestiscono l’accesso per te." },
        { t: "mc", q: "Per autenticarti su GitHub da terminale si usa…", opts: ["Un token personale o una chiave SSH, non la password", "La password dell’account", "Nessuna autenticazione"], a: 0, why: "GitHub non accetta più la password per le operazioni Git." }
    ]},
    { id: "gt6", title: "Una buona repository", sub: "README, licenza, versioni", ex: [
        { t: "info", title: "Il README", text: "Il file `README.md` è la prima cosa che si vede aprendo una repository su GitHub. È scritto in **Markdown**: testo semplice in cui `#` crea un titolo, `-` un elenco, e i blocchi tra tre apici inversi sono codice.\n\nDeve dire per prima cosa **cosa fa** il progetto e **come si usa**, con un esempio. Poi: come si installa, da cosa dipende, come citarlo o contribuire." },
        { t: "mc", q: "Cosa deve dire per prima cosa il README?", opts: ["Cosa fa il tool e un esempio d’uso", "La storia dei commit", "Chi sei"], a: 0, why: "Chi arriva sulla repo deve capire in 10 secondi se gli serve." },
        { t: "info", title: "La licenza", text: "Senza un file di licenza, il codice resta coperto dal **diritto d’autore**: anche se è pubblico, gli altri non hanno il permesso legale di riusarlo o modificarlo. Una licenza dice cosa è permesso.\n\nLe più comuni per progetti aperti: **MIT** (molto permissiva), **Apache 2.0** (permissiva, con clausole sui brevetti), **GPL** (chi distribuisce versioni modificate deve renderle aperte con la stessa licenza). GitHub ti fa scegliere quando crei la repo." },
        { t: "mc", q: "Senza licenza, gli altri possono riusare il tuo codice?", opts: ["Legalmente no: senza licenza vale il diritto d’autore pieno", "Sì, tutto ciò che è pubblico è libero", "Solo per uso personale"], a: 0, why: "Licenze comuni per progetti aperti: MIT, Apache 2.0, GPL." },
        { t: "info", title: "Versioni e tag", text: "Il **versionamento semantico** usa tre numeri, `MAGGIORE.MINORE.PATCH` (es. `1.2.0`):", points: ["**PATCH** (`1.2.1`): correzioni di bug;", "**MINORE** (`1.3.0`): funzioni nuove che non rompono l’uso precedente;", "**MAGGIORE** (`2.0.0`): cambiamenti incompatibili."], code: `git tag v0.1.0
git push --tags      # i tag vanno inviati a parte`, note: "Su GitHub, da un tag puoi creare una **Release**: una pagina con le note della versione e i file da scaricare." },
        { t: "mc", q: "Cosa indica v1.2.0 nel versionamento semantico?", opts: ["MAGGIORE.MINORE.PATCH", "anno.mese.giorno", "numero di commit"], a: 0, why: "PATCH = correzioni, MINORE = novità compatibili, MAGGIORE = cambiamenti incompatibili." },
        { t: "fill", q: "Segna questa versione.", code: `git ___ v0.1.0`, bank: ["tag", "label", "version"], ans: ["tag"], why: "Su GitHub, da un tag puoi creare una release." },
        { t: "info", title: "Pull request", text: "Una **pull request** (PR) è una proposta di unire un branch in un altro su GitHub. Mostra le differenze, permette di commentarle riga per riga, e si unisce con un clic quando va bene.\n\nÈ il modo standard per contribuire ai progetti degli altri, ma è utile anche da soli: ti obbliga a rileggere le modifiche prima di portarle su `main`." },
        { t: "mc", q: "Cos’è una pull request?", opts: ["Una proposta di unire un branch, con revisione e commenti", "Un modo per scaricare", "Un commit urgente"], a: 0, why: "È il modo standard per contribuire ai progetti degli altri." }
    ]},
    { id: "gt7s", kind: "sfida", title: "Missione · La tua prima repository", sub: "Commit e .gitignore dal vivo", ex: [
        { t: "info", title: "Come funziona una missione", text: "Le missioni si svolgono **sul tuo computer**, perché Git non può girare dentro l’app. Segui le istruzioni, esegui i comandi e **incolla il risultato** nel riquadro: l’app controlla se è corretto.\n\nCome nelle sfide hai a disposizione suggerimenti e, dopo un paio di tentativi, la soluzione." },
        { t: "info", title: "Installare Git", text: "**Mac**: scrivi `git --version` nel Terminale; se non c’è, il Mac ti propone di installarlo. **Windows**: installa Git da git-scm.com (include Git Bash). **Linux**: con il gestore di pacchetti (es. `sudo apt install git`).\n\nPoi, una volta sola, configura nome ed email:", code: `git config --global user.name "Il tuo nome"
git config --global user.email "tua@email.it"` },
        {
          t: "task",
          q: "Due commit",
          text: "Crea una repository, fai **due commit**, poi conta quanti commit ci sono nella storia.",
          points: ["Esegui i comandi qui sopra: fanno il **primo** commit.", "Poi modifica `README.md` (per esempio aggiungi una riga con `echo \"altra riga\" >> README.md`) e fai **tu** il secondo commit.", "Infine esegui `git log --oneline | wc -l` e scrivi il risultato."],
          code: `mkdir -p ~/elica-missioni/prima-repo
cd ~/elica-missioni/prima-repo
git init
echo "# Il mio progetto" > README.md
git add README.md
git commit -m "Primo commit"`,
          ans: ["2"],
          hints: ["Dopo aver modificato il file, `git status` ti mostra che è cambiato.", "Per il secondo commit servono due comandi: `git add README.md` e `git commit -m \"…\"`.", "`git log --oneline` mostra un commit per riga, `wc -l` conta le righe."],
          solution: `echo "altra riga" >> README.md
git add README.md
git commit -m "Aggiunge una riga al README"
git log --oneline | wc -l`,
          why: "L’ultimo comando stampa `2`. Ogni `git commit` aggiunge una “fotografia” alla storia; senza `git add` prima, il commit non avrebbe nulla da salvare."
        },
        {
          t: "task",
          q: "Ignorare i risultati",
          text: "Sempre nella stessa repository, crea una cartella di risultati e un `.gitignore` che la escluda. Poi guarda cosa vede Git.",
          points: ["Esegui i comandi e incolla l’output di `git status --short`."],
          code: `mkdir -p results
echo "dati" > results/tabella.tsv
echo "results/" > .gitignore
git status --short`,
          ans: ["?? .gitignore"],
          multiline: true,
          hints: ["`git status --short` mostra una riga per file, con `??` per i file non tracciati.", "Se vedi anche `results/`, controlla il contenuto di `.gitignore` con `cat .gitignore`."],
          solution: `git status --short`,
          why: "L’output è `?? .gitignore`: Git mostra solo `.gitignore`, ancora da aggiungere, perché la cartella `results/` è ignorata. Ricordati di fare il commit anche di `.gitignore`."
        }
    ]}
  ]}
  ]
});

/* Percorso: Progetto pipeline genomi batterici
   Si sblocca completando la lezione p6b (Python, Settimana 6). */
ELICA.addCourse({
  id: "proj",
  order: 70,
  name: "Progetto",
  lang: "bash",
  req: {"lesson":"p6b","label":"Python fino alla Settimana 6 (File I/O)"},
  tag: "Costruisci la tua pipeline: due genomi batterici, confronto delle proteine, ricerche iterative e classificazione. Esempio guida: E. coli K-12 (innocuo) contro O157:H7 Sakai (patogeno).",
  units: [
  { title: "Il progetto", lessons: [
    { id: "pr1", title: "Il piano", sub: "Cosa costruiremo", ex: [
        { t: "info", title: "L’obiettivo", text: "Vogliamo confrontare due **genomi batterici**, per esempio un ceppo patogeno e uno innocuo della stessa specie, e trovare le **proteine che ha uno e non l’altro**. Sono i primi candidati per spiegare le differenze: tossine, sistemi di adesione, resistenze.\n\nEsempio guida: *E. coli* K-12, il ceppo innocuo dei laboratori, contro *E. coli* O157:H7 Sakai, che causa gravi infezioni intestinali. Quando fu sequenziato Sakai, il confronto mostrò circa 4,1 Mb di genoma in comune e circa 1,4 Mb presenti solo in O157 (Hayashi et al., 2001)." },
        { t: "info", title: "Le parole da conoscere", text: "Prima di costruire la pipeline:", points: ["**Genoma assemblato** (*assembly*): la sequenza di DNA di un organismo ricostruita dalle read; per un batterio di solito un cromosoma più eventuali **plasmidi** (piccoli DNA circolari).", "**Annotazione**: l’elenco dei geni trovati nel genoma, con le loro posizioni e le proteine che codificano.", "**Omologhe**: proteine che derivano da un antenato comune; si riconoscono perché le loro sequenze si somigliano.", "**Allineamento**: mettere due sequenze una sotto l’altra per far corrispondere le parti simili e misurare quanto si somigliano.", "**Pipeline**: una serie di passaggi automatici in cui l’output di uno diventa l’input del successivo."] },
        { t: "info", title: "La pipeline in un colpo d’occhio", text: "Partiamo dalle proteine del genoma A e le cerchiamo tra quelle di B. Quelle senza corrispondenza passano a ricerche via via più sensibili. Ciò che resta alla fine è specifico di A, e lo classifichiamo con banche dati curate.", code: `genomi A e B
 └─ proteine di A (.faa)
     └─ DIAMOND blastp contro le proteine di B  → con match: comuni
         └─ senza match: candidate
             └─ ricerche più sensibili (tblastn sul DNA di B) → falsi positivi
                 └─ restano le specifiche di A
                     └─ DIAMOND contro VFDB/CARD → classificazione` },
        { t: "mc", q: "Perché ripetere la ricerca delle candidate contro il DNA di B?", opts: ["Per ritrovare geni presenti in B ma non annotati o molto divergenti", "Per tradurre il DNA", "Per velocizzare DIAMOND"], a: 0, why: "Senza questo passaggio molte “proteine uniche” sarebbero falsi positivi." },
        { t: "mc", q: "Nel confronto K-12 contro O157:H7 Sakai cosa ci aspettiamo?", opts: ["Uno scheletro comune di circa 4,1 Mb e circa 1,4 Mb di sequenze specifiche di O157", "Genomi identici", "Nessuna proteina in comune"], a: 0, why: "È il risultato dell’articolo che ha sequenziato Sakai (Hayashi et al., 2001)." },
        { t: "info", title: "Due direzioni, due risposte", text: "Il confronto **non è simmetrico**: “cosa ha A che B non ha” e “cosa ha B che A non ha” sono due domande diverse, con due liste diverse. La pipeline va quindi eseguita in entrambe le direzioni (A→B e B→A)." },
        { t: "mc", q: "In quante direzioni va fatto il confronto?", opts: ["In entrambe: A contro B e B contro A", "Solo A contro B", "Non importa"], a: 0, why: "Le specifiche di A e quelle di B sono due liste diverse." },
        { t: "info", title: "Perché le proteine", text: "Il codice genetico è **ridondante**: più codoni codificano lo stesso amminoacido. Molte mutazioni del DNA (*sinonime*) non cambiano la proteina, quindi due geni omologhi possono differire parecchio nel DNA ma poco nella proteina. Confrontare le proteine trova somiglianze anche tra sequenze più lontane." },
        { t: "mc", q: "Perché confrontare proteine e non solo DNA?", opts: ["Le proteine sono più conservate: le mutazioni sinonime non cambiano gli amminoacidi", "Il DNA non si può allineare", "Le proteine sono più lunghe"], a: 0, why: "Due geni omologhi possono differire molto nel DNA ma poco nella proteina." }
    ]},
    { id: "pr2", title: "Ambiente e cartelle", sub: "conda, bioconda, git", ex: [
        { t: "info", title: "Installare gli strumenti: conda", text: "Gli strumenti bioinformatici (DIAMOND, BLAST…) sono programmi separati, non pacchetti Python. Il modo più semplice per installarli tutti è **conda** (o la sua versione più veloce, **mamba**): un gestore che installa programmi e librerie in **ambienti** separati.\n\nUn **ambiente** è un insieme isolato di programmi con versioni precise: progetti diversi non si disturbano a vicenda. I programmi vengono da **canali**: `conda-forge` (software generale) e `bioconda` (bioinformatica)." },
        { t: "info", title: "environment.yml", text: "Invece di installare a mano, si scrive un file `environment.yml` con l’elenco di cosa serve. Chiunque, compreso te su un altro computer, può ricreare **lo stesso ambiente** con un comando: è la base della **riproducibilità**.", code: `# environment.yml
name: genome-diff
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - biopython
  - pandas
  - ncbi-datasets-cli
  - diamond
  - blast
  - pytest

# nel terminale
conda env create -f environment.yml
conda activate genome-diff`, note: "`conda activate` va ripetuto **ogni volta** che apri un nuovo terminale; prima di attivare l’ambiente, i programmi installati lì non si trovano." },
        { t: "mc", q: "Da quale canale conda arrivano DIAMOND e BLAST?", opts: ["bioconda", "pip", "apt-get"], a: 0, why: "bioconda raccoglie migliaia di strumenti bioinformatici." },
        { t: "info", title: "La struttura del progetto", text: "Una struttura ordinata fin dall’inizio ti risparmia fatica:", points: ["`src/`: il codice;", "`tests/`: i test;", "`data/`: i dati scaricati (fuori da Git);", "`results/`: i risultati (fuori da Git);", "`environment.yml`, `README.md`, `.gitignore` nella cartella principale."] },
        { t: "order", q: "Prepara il progetto da zero.", lines: ["mkdir genome-diff && cd genome-diff", "git init", "mkdir data results src tests", "conda env create -f environment.yml", "conda activate genome-diff"], why: "Cartella, repository, struttura, ambiente." },
        { t: "mc", q: "Perché data/ e results/ vanno nel .gitignore?", opts: ["Sono rigenerabili e spesso grandi", "Git non accetta cartelle", "Per sicurezza"], a: 0, why: "Nella repository va il codice che li produce." },
        { t: "fill", q: "Attiva l’ambiente.", code: `conda ___ genome-diff`, bank: ["activate", "start", "use"], ans: ["activate"], why: "Da quel momento il terminale usa gli strumenti dell’ambiente." }
    ]}
  ]},
  { title: "I dati", lessons: [
    { id: "pr3", title: "Scaricare i genomi", sub: "NCBI datasets e subprocess", ex: [
        { t: "info", title: "NCBI e gli accession", text: "L’**NCBI** (National Center for Biotechnology Information, USA) gestisce le principali banche dati pubbliche di sequenze. Ogni genoma assemblato ha un codice univoco, l’**accession**:", points: ["*E. coli* K-12 MG1655: `GCF_000005845.2`", "*E. coli* O157:H7 Sakai: `GCF_000008865.2`", "Il numero dopo il punto è la **versione** dell’assembly.", "`GCA_` indica un assembly di **GenBank** (depositato da chi l’ha sequenziato); `GCF_` uno di **RefSeq**, la raccolta selezionata e annotata da NCBI. Spesso esistono entrambi con lo stesso numero."] },

        { t: "info", title: "Prima guarda i dati", text: "Prima di qualsiasi analisi, controlla cosa hai scaricato: è il modo più rapido per scoprire errori, come il genoma sbagliato o un file vuoto. Le domande da farsi:", points: ["quante sequenze contiene il `.fna`? (cromosoma + plasmidi)", "quanto è lungo in totale?", "qual è il contenuto GC?", "quante proteine ci sono nel `.faa`?"] },
        { t: "info", title: "Un riassunto con Biopython", text: "Con `SeqIO.parse` leggi tutte le sequenze del genoma e calcoli le statistiche. Per contare le proteine non serve tenerle tutte in memoria: `sum(1 for _ in …)` aggiunge 1 per ogni record mentre li legge.", code: `from Bio import SeqIO

with open("mini.fna", "w") as f:
    f.write(">chr\\nATGCGCATTA\\n>plasmide\\nGGCC\\n")
with open("mini.faa", "w") as f:
    f.write(">p1\\nMKV\\n>p2\\nMAL\\n")

def riassunto(fna, faa):

print(riassunto("mini.fna", "mini.faa"))` },

        { t: "info", title: "Come si cercano sequenze simili", text: "**BLAST** è lo strumento classico per cercare sequenze simili a una sequenza di partenza (la **query**) dentro una **banca dati**. Trova regioni simili e le allinea, assegnando a ogni risultato (*hit*) dei numeri che dicono quanto è buono:", points: ["**identità** (`pident`): la percentuale di posizioni uguali nell’allineamento;", "**lunghezza** dell’allineamento e **copertura**: quanta parte della query è allineata;", "**bitscore**: un punteggio, più alto è meglio;", "**e-value**: quanti risultati così buoni ti aspetteresti **per puro caso** in quella banca dati. Più è piccolo, più il risultato è credibile (`1e-50` è molto meglio di `1e-5`)."] },
        { t: "info", title: "DIAMOND", text: "**DIAMOND** fa lo stesso lavoro di BLASTP (proteine contro proteine) ma molto più velocemente: è adatto a confrontare migliaia di proteine. Nella modalità predefinita trova bene le somiglianze forti; per quelle più deboli esistono opzioni più sensibili e lente, come `--sensitive` o `--more-sensitive`. Due passaggi:", points: ["`diamond makedb`: trasforma il FASTA di B in una banca dati;", "`diamond blastp`: cerca le proteine di A (`-q`, query) nella banca dati (`-d`)."], code: `diamond makedb --in data/B.faa -d results/B

    --outfmt 6 --evalue 1e-5 --max-target-seqs 1
# --outfmt 6 = tabella con 12 colonne:
# qseqid sseqid pident length mismatch gapopen
# qstart qend sstart send evalue bitscore`, note: "`blastp` = proteine contro proteine; `blastx` = DNA tradotto contro proteine. Qui le query sono proteine, quindi `blastp`." },
        { t: "mc", q: "Cosa indica la colonna pident?", opts: ["La percentuale di identità dell’allineamento", "La lunghezza della proteina", "Il punteggio"], a: 0, why: "length è la lunghezza dell’allineamento, bitscore il punteggio." },
        { t: "mc", q: "Un e-value di 1e-50, rispetto a 1e-5, è…", opts: ["Molto più significativo", "Meno significativo", "Uguale"], a: 0, why: "L’e-value è il numero di match così buoni attesi per caso: più è piccolo, meglio è." },
        { t: "fill", q: "Cerca proteine contro proteine.", code: `diamond ___ -q A.faa -d B -o hits.tsv`, bank: ["blastp", "blastx", "search"], ans: ["blastp"], why: "blastx traduce una query di DNA; qui le query sono già proteine." },
        { t: "info", title: "Non basta l’e-value", text: "Un e-value bassissimo può venire anche da un solo **dominio** in comune, cioè un pezzo di proteina che ricorre in famiglie diverse. Per dire che una proteina “è presente” in B conviene chiedere anche una buona **identità** e una buona **copertura** della query (es. almeno il 50–70%)." },
        { t: "mc", q: "Perché oltre all’e-value serve la copertura?", opts: ["Un match su un piccolo dominio non significa che la proteina intera sia presente", "L’e-value è sempre sbagliato", "La copertura è più veloce"], a: 0, why: "Copertura = quanta parte della query è allineata." },
        { t: "info", title: "Leggere i risultati con pandas", text: "Il file di `--outfmt 6` è una tabella separata da tab **senza intestazione**: i nomi delle colonne li fornisci tu con `names=`. Poi filtri con le maschere di pandas.", code: `import pandas as pd

cols = ["qseqid", "sseqid", "pident", "length", "mismatch", "gapopen",

    { id: "pr6", title: "Le proteine senza match", sub: "Differenza tra insiemi", ex: [
        { t: "info", title: "Chi è rimasto fuori: differenza tra insiemi", text: "Le **candidate** sono le proteine di A che **non** hanno un buon match in B. In termini di insiemi: tutte le proteine di A **meno** quelle con match. Con i `set` di Python è un’operazione sola: `tutte - con_match`.\n\nI set sono adatti anche perché il controllo `x in insieme` è velocissimo, anche con migliaia di elementi.", code: `tutte = {"p1", "p2", "p3", "p4"}

          files: {"A.faa":">p1 proteina 1\nMKV\n>p2\nMAL\n>p3\nMSS\n>p4\nMTT\n","hits.tsv":"p1\tb1\t98.5\t201\t3\t0\t1\t201\t1\t201\t1e-150\t400\np3\tb3\t35.0\t80\t52\t2\t1\t80\t5\t84\t1e-3\t40\np3\tb7\t45.0\t90\t49\t1\t1\t90\t1\t90\t1e-8\t60\np4\tb4\t39.9\t100\t60\t0\t1\t100\t1\t100\t1e-6\t50\n"},

            {"call":"proteine_specifiche(\"A.faa\", \"hits.tsv\", 99)","expect":"[\"p1\", \"p2\", \"p3\", \"p4\"]","desc":"soglia 99%"}
          ],
          hints: ["Leggi gli id dal FASTA: per ogni riga che inizia con `>`, aggiungi `riga[1:].split()[0]` a un insieme `tutte`.", "Per la tabella: `campi = riga.rstrip(\"\\n\").split(\"\\t\")`, poi `float(campi[2]) >= min_ident` → aggiungi `campi[0]` all’insieme `con_match`.", "Il risultato è `sorted(tutte - con_match)`."],
          solution: `def proteine_specifiche(faa, tsv, min_ident):
    tutte = set()
    with open(faa) as f:
        for riga in f:
            if riga.startswith(">"):
                tutte.add(riga[1:].split()[0])
    con_match = set()
    with open(tsv) as f:
        for riga in f:
            campi = riga.rstrip("\\n").split("\\t")
            if len(campi) >= 3 and float(campi[2]) >= min_ident:
                con_match.add(campi[0])

        { t: "info", title: "Cosa aspettarsi da O157:H7", text: "Tra le proteine di Sakai assenti in K-12 ci si aspetta per esempio la **tossina Shiga** (geni `stx`), portata da profagi: virus batterici integrati nel genoma. Geni essenziali come `rpoB` (RNA polimerasi) o `gyrA` (girasi) invece ci sono in tutti gli *E. coli*: se comparissero tra le “specifiche”, sarebbe il segno di un errore nella pipeline." },
